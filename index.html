<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Asistencias - ModaShop</title>
    <link rel="icon" type="image/png" href="img/isologo-modashop.png">
    
    <!-- Versiones fijas: una versión nueva publicada en el CDN no puede romper el sistema -->
    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for branding -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase + datos compartidos con el Módulo de Asistencias (asistencias.html) -->
    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/datos.js"></script>

    <!-- Paleta y tipografía del Manual de Marca -->
    <script src="js/marca.js"></script>

    <style>
        #print-area { display: none; }

        @media print {
            body * { visibility: hidden; }
            body, html {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
            }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
            }
            @page { margin: 1cm; size: portrait; }
            table, tr, td { page-break-inside: avoid; }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased h-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2 }).format(value || 0);
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                'bar-chart': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>,
                'users': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
                'calculator': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>,
                'file-text': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
                'printer': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
                'save': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
                'trash': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
                'edit': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
                'x': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
                'award': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>,
                'alert-triangle': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
                'settings': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
                'download': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
                'upload': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
                'clock': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
                'external': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>,
                'lock': <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            };
            return icons[name] || <svg className={className}></svg>;
        };

        const FaltaConfiguracion = () => (
            <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                <div className="max-w-lg w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
                    <Icon name="alert-triangle" className="w-12 h-12 text-amber-500 mx-auto mb-4"/>
                    <h2 className="text-xl font-black text-slate-800 mb-2">Falta conectar Firebase</h2>
                    <p className="text-slate-600">Completá los datos de tu proyecto en <code className="bg-slate-100 px-1.5 py-0.5 rounded font-bold">js/firebase-config.js</code>. Los pasos están en el archivo <code className="bg-slate-100 px-1.5 py-0.5 rounded font-bold">README.md</code>.</p>
                </div>
            </div>
        );

        const LoginScreen = ({ errorExterno }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [cargando, setCargando] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setCargando(true);
                try {
                    await Datos.iniciarSesion(username, password);
                } catch (err) {
                    setError(Datos.errorAmigable(err));
                    setCargando(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                        <div className="bg-white p-8 flex flex-col items-center justify-center border-b-4 border-brand-primary">
                            <img src="img/logo-modashop.png" alt="MODASHOP" className="h-16 w-auto object-contain mb-5" />
                            <h2 className="text-2xl font-black tracking-widest text-brand-negro leading-tight text-center">SISTEMA DE <span className="text-brand-primary">SUELDOS</span></h2>
                        </div>
                        <div className="p-8">
                            <h3 className="text-lg font-bold text-slate-700 mb-6 text-center">Ingreso al panel de administración</h3>
                            {(error || errorExterno) && (
                                <div className="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 text-sm font-bold rounded-lg text-center">
                                    {error || errorExterno}
                                </div>
                            )}
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Email</label>
                                    <input
                                        type="email"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-primary outline-none transition-all font-semibold"
                                        placeholder="admin@tuempresa.com"
                                        autoComplete="username"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-primary outline-none transition-all font-semibold"
                                        placeholder="••••••••••••"
                                        autoComplete="current-password"
                                        required
                                    />
                                </div>
                                <button type="submit" disabled={cargando} className="w-full bg-brand-primary text-white font-black uppercase tracking-wider py-3 rounded-xl shadow-md hover:bg-opacity-90 transition-all active:scale-95 mt-4 disabled:opacity-60">
                                    {cargando ? 'Ingresando...' : 'Iniciar Sesión'}
                                </button>
                            </form>
                            <div className="mt-6 text-center"><MarcaPSM /></div>
                        </div>
                    </div>
                </div>
            );
        };

        // Marca de agua del desarrollador
        const MarcaPSM = () => (
            <a href="https://psmsaas.pages.dev/" target="_blank" rel="noopener noreferrer" title="psmsaas.pages.dev"
                className="inline-flex items-center gap-1.5 text-[11px] text-slate-400 opacity-70 hover:opacity-100 hover:text-slate-600 transition-opacity">
                <span>Powered by:</span>
                <img src="https://psmsaas.pages.dev/psm.png" alt="" className="h-4 w-4 object-contain" onError={e => { e.currentTarget.style.display = 'none'; }} />
                <span className="font-bold">psmsaas</span>
            </a>
        );

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
                        <Icon name="alert-triangle" className="w-12 h-12 text-amber-500 mx-auto mb-4"/>
                        <h3 className="text-lg font-bold text-slate-800 mb-2">Confirmar Acción</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onCancel} className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition-colors">Cancelar</button>
                            <button onClick={onConfirm} className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition-colors">Confirmar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Recibo = ({ recibo, isPremio = false, tipo = 'ORIGINAL' }) => {
            if (!recibo) return null;
            return (
                <div className="bg-white border-2 border-slate-800 p-6 text-black w-full shadow-sm relative font-sans mb-4" style={{breakInside: 'avoid', pageBreakInside: 'avoid'}}>
                    <div className="flex justify-between border-b-2 border-slate-800 pb-4 mb-4">
                        <div>
                            <h2 className="text-2xl font-black uppercase tracking-wider text-slate-900">{isPremio ? 'RECIBO DE PREMIOS' : 'RECIBO DE SUELDO'}</h2>
                            <p className="text-xs font-bold text-slate-700 bg-slate-200 inline-block px-2 py-0.5 rounded mt-1 border border-slate-300">{tipo}</p>
                        </div>
                        <div className="text-right">
                            <p className="font-semibold text-slate-700">Período: {recibo.periodo}</p>
                            <p className="text-sm text-slate-500">Fecha Impresión: {new Date().toLocaleDateString('es-AR')}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 border-b-2 border-slate-800 pb-3 mb-3 text-sm">
                        <div>
                            <p><span className="font-bold text-slate-700">Empleado:</span> {recibo.empleado.nombre}</p>
                            <p><span className="font-bold text-slate-700">CUIL:</span> {recibo.empleado.cuil || 'S/D'}</p>
                        </div>
                        <div>
                            <p><span className="font-bold text-slate-700">Legajo:</span> {recibo.empleado.legajo || 'S/D'}</p>
                            <p><span className="font-bold text-slate-700">Puesto:</span> {recibo.empleado.puesto || 'S/D'}</p>
                        </div>
                    </div>

                    <table className="w-full text-sm mb-4">
                        <thead>
                            <tr className="bg-slate-100 border-y border-slate-800">
                                <th className="py-1 px-2 text-left w-1/2">Concepto</th>
                                <th className="py-1 px-2 text-right">Haberes</th>
                                <th className="py-1 px-2 text-right">Deducciones</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                            {isPremio ? (
                                <>
                                    {recibo.detallePremios && recibo.detallePremios.map((premio, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50">
                                            <td className="py-1 px-2">{premio.concepto}</td>
                                            <td className="py-1 px-2 text-right font-medium">{formatCurrency(premio.monto)}</td>
                                            <td className="py-1 px-2 text-right"></td>
                                        </tr>
                                    ))}
                                    {recibo.detallePremios?.length === 0 && (
                                        <tr><td colSpan="3" className="py-4 text-center text-slate-500">Sin detalles de premios</td></tr>
                                    )}
                                </>
                            ) : (
                                <>
                                    {recibo.detalleDias && recibo.detalleDias.length > 0 ? (
                                        <>
                                            <tr className="bg-slate-50 font-bold text-xs uppercase text-slate-500"><td colSpan="3" className="py-1 px-2">Detalle Diario ({recibo.tipoLiquidacion})</td></tr>
                                            {recibo.detalleDias.map((dia, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="py-0.5 px-2 pl-6 flex items-center gap-2 text-xs">
                                                        {dia.fecha || 'Sin fecha'} ({dia.horas} hs) 
                                                        {dia.esFeriado && <span className="bg-indigo-100 text-indigo-700 px-1 py-0.5 text-[9px] font-bold rounded">FERIADO</span>}
                                                    </td>
                                                    <td className="py-0.5 px-2 text-right font-medium text-xs">{formatCurrency(dia.montoCalculado)}</td>
                                                    <td className="py-0.5 px-2 text-right"></td>
                                                </tr>
                                            ))}
                                            <tr className="border-t border-slate-300 bg-slate-100 font-bold">
                                                <td className="py-1 px-2 text-right text-slate-700">Subtotal Base:</td>
                                                <td className="py-1 px-2 text-right">{formatCurrency(recibo.sueldoBase)}</td>
                                                <td className="py-1 px-2 text-right"></td>
                                            </tr>
                                        </>
                                    ) : (
                                        <tr>
                                            <td className="py-1 px-2">Sueldo Básico ({recibo.tipoLiquidacion})</td>
                                            <td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.sueldoBase)}</td>
                                            <td className="py-1 px-2 text-right"></td>
                                        </tr>
                                    )}

                                    {Number(recibo.presentismo) > 0 && (
                                        <tr><td className="py-1 px-2">Adicional Presentismo</td><td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.presentismo)}</td><td></td></tr>
                                    )}
                                    {Number(recibo.transporte) > 0 && (
                                        <tr><td className="py-1 px-2">Adicional Transporte / SUBE</td><td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.transporte)}</td><td></td></tr>
                                    )}
                                    {Number(recibo.premios) > 0 && (
                                        <tr><td className="py-1 px-2">{recibo.conceptoPremio || 'Premios / Extras'}</td><td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.premios)}</td><td></td></tr>
                                    )}
                                    {Number(recibo.aguinaldo) > 0 && (
                                        <tr><td className="py-1 px-2">S.A.C. (Aguinaldo)</td><td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.aguinaldo)}</td><td></td></tr>
                                    )}
                                </>
                            )}
                            
                            {Number(recibo.descuentoCtaCte) > 0 && !isPremio && (
                                <tr className="text-red-700 bg-red-50/30">
                                    <td className="py-1 px-2">Descuento Cuenta Corriente</td>
                                    <td></td>
                                    <td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.descuentoCtaCte)}</td>
                                </tr>
                            )}
                            {Number(recibo.otrosDescuentos) > 0 && (
                                <tr className="text-red-700 bg-red-50/30">
                                    <td className="py-1 px-2">{recibo.conceptoDescuento || 'Otros Descuentos'}</td>
                                    <td></td>
                                    <td className="py-1 px-2 text-right font-medium">{formatCurrency(recibo.otrosDescuentos)}</td>
                                </tr>
                            )}
                        </tbody>
                        <tfoot className="border-t-2 border-slate-800">
                            <tr className="font-bold text-sm">
                                <td className="py-2 px-2 text-right text-slate-700">SUBTOTALES</td>
                                <td className="py-2 px-2 text-right text-emerald-700">{formatCurrency(recibo.totalHaberes)}</td>
                                <td className="py-2 px-2 text-right text-red-700">{formatCurrency(recibo.totalDeducciones)}</td>
                            </tr>
                            <tr className="bg-slate-200 border-t-2 border-slate-800 text-lg">
                                <td colSpan="2" className="py-3 px-2 text-right font-black uppercase tracking-wide text-slate-800">NETO A PAGAR:</td>
                                <td className="py-3 px-2 text-right font-black text-brand-primary text-xl">{formatCurrency(recibo.neto)}</td>
                            </tr>
                        </tfoot>
                    </table>

                    <div className="flex justify-end mt-8 text-center text-xs font-bold text-slate-800">
                        <div className="w-1/2 max-w-xs border-t border-slate-400 pt-1">
                            <p>Firma Empleado</p>
                            <p className="text-[10px] font-normal mt-1 text-slate-500">Recibí conforme el importe neto detallado.</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ historial }) => {
            const analisisMensual = useMemo(() => {
                const agrupado = {};
                historial.forEach(h => {
                    const mes = h.periodo ? h.periodo.toUpperCase().trim() : 'SIN FECHA';
                    
                    if (!agrupado[mes]) agrupado[mes] = { 
                        periodo: mes, 
                        haberes: 0, 
                        deducciones: 0, 
                        neto: 0, 
                        ctaCte: 0, 
                        sueldoBase: 0,
                        premios: 0,
                        presentismo: 0,
                        transporte: 0,
                        aguinaldo: 0,
                        empleadosSet: new Set(),
                        detalleEmpleados: {} 
                    };
                    agrupado[mes].haberes += h.totalHaberes || 0;
                    agrupado[mes].deducciones += h.totalDeducciones || 0;
                    agrupado[mes].neto += h.neto || 0;
                    agrupado[mes].ctaCte += (Number(h.descuentoCtaCte) || 0);
                    agrupado[mes].sueldoBase += (Number(h.sueldoBase) || 0);
                    agrupado[mes].premios += (Number(h.premios) || 0);
                    agrupado[mes].presentismo += (Number(h.presentismo) || 0);
                    agrupado[mes].transporte += (Number(h.transporte) || 0);
                    agrupado[mes].aguinaldo += (Number(h.aguinaldo) || 0);
                    agrupado[mes].empleadosSet.add(h.empleado.id);

                    const empId = h.empleado.id;
                    if(!agrupado[mes].detalleEmpleados[empId]) {
                         agrupado[mes].detalleEmpleados[empId] = { nombre: h.empleado.nombre, neto: 0 };
                    }
                    agrupado[mes].detalleEmpleados[empId].neto += h.neto || 0;
                });
                
                return Object.values(agrupado)
                    .map(a => ({ ...a, cantEmpleados: a.empleadosSet.size }))
                    .sort((a, b) => {
                        const getValorMes = (str) => {
                            const partes = str.toLowerCase().trim().split(' ');
                            if(partes.length < 2) return str;
                            const meses = {enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7, agosto:8, septiembre:9, octubre:10, noviembre:11, diciembre:12};
                            const mesNum = meses[partes[0]] || 0;
                            const anio = parseInt(partes[1]) || 0;
                            return anio * 100 + mesNum;
                        };
                        return getValorMes(b.periodo) - getValorMes(a.periodo);
                    });
            }, [historial]);

            const analisisAgente = useMemo(() => {
                if (analisisMensual.length < 2) return null;
                const mesActual = analisisMensual[0];
                const mesAnterior = analisisMensual[1];
                const diffNeto = mesActual.neto - mesAnterior.neto;
                const porcentajeVariacion = mesAnterior.neto === 0 ? 100 : ((diffNeto / mesAnterior.neto) * 100).toFixed(2);
                const motivosGlobales = [];
                
                const compararConcepto = (conceptoDesc, valActual, valAnterior, esDeduccion = false) => {
                    const dif = valActual - valAnterior;
                    if (Math.abs(dif) > 10) { 
                        const impactoReal = esDeduccion ? -dif : dif; 
                        motivosGlobales.push({
                            concepto: conceptoDesc,
                            diferencia: dif,
                            impacto: impactoReal,
                            detalle: `El gasto en este concepto fue de ${formatCurrency(valActual)} (vs ${formatCurrency(valAnterior)}). Impacto: ${impactoReal > 0 ? '+' : ''}${formatCurrency(impactoReal)}`
                        });
                    }
                };

                compararConcepto('Sueldos Básicos', mesActual.sueldoBase, mesAnterior.sueldoBase);
                compararConcepto('Premios y Bonificaciones', mesActual.premios, mesAnterior.premios);
                compararConcepto('Presentismo', mesActual.presentismo, mesAnterior.presentismo);
                compararConcepto('Transporte / SUBE', mesActual.transporte, mesAnterior.transporte);
                compararConcepto('S.A.C. (Aguinaldo)', mesActual.aguinaldo, mesAnterior.aguinaldo);
                compararConcepto('Descuentos (Deducciones)', mesActual.deducciones, mesAnterior.deducciones, true);
                
                if (mesActual.cantEmpleados !== mesAnterior.cantEmpleados) {
                     motivosGlobales.push({
                        concepto: 'Plantilla de Empleados',
                        diferencia: mesActual.cantEmpleados - mesAnterior.cantEmpleados,
                        impacto: 0,
                        detalle: `Se liquidaron sueldos a ${mesActual.cantEmpleados} empleado(s) este mes, frente a los ${mesAnterior.cantEmpleados} del mes anterior.`
                    });
                }

                const alertasEmpleados = [];
                Object.keys(mesActual.detalleEmpleados).forEach(empId => {
                    const pagoActual = mesActual.detalleEmpleados[empId].neto;
                    const pagoAnterior = mesAnterior.detalleEmpleados[empId] ? mesAnterior.detalleEmpleados[empId].neto : 0;
                    
                    if (pagoAnterior > 0) {
                        const difPago = pagoActual - pagoAnterior;
                        const porcPago = (difPago / pagoAnterior) * 100;
                        
                        if (Math.abs(porcPago) >= 1) { 
                            alertasEmpleados.push({
                                nombre: mesActual.detalleEmpleados[empId].nombre,
                                variacion: difPago,
                                porcentaje: porcPago.toFixed(1),
                                tipo: difPago > 0 ? 'Cobró Más' : 'Cobró Menos',
                                detalle: `Pasó de ${formatCurrency(pagoAnterior)} a ${formatCurrency(pagoActual)}.`
                            });
                        }
                    } else {
                         alertasEmpleados.push({
                            nombre: mesActual.detalleEmpleados[empId].nombre,
                            variacion: pagoActual,
                            porcentaje: 100,
                            tipo: 'Nuevo / 1er Cobro',
                            detalle: `No registra pagos en el período anterior.`
                        });
                    }
                });

                return {
                    mesActual: mesActual.periodo,
                    mesAnterior: mesAnterior.periodo,
                    diferenciaTotal: diffNeto,
                    porcentaje: porcentajeVariacion,
                    motivos: motivosGlobales.sort((a, b) => Math.abs(b.impacto) - Math.abs(a.impacto)),
                    alertas: alertasEmpleados.sort((a, b) => Math.abs(b.variacion) - Math.abs(a.variacion))
                };
            }, [analisisMensual]);

            return (
                <div className="space-y-6 max-w-6xl mx-auto p-6 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div className="flex items-center gap-3 border-b border-slate-200 pb-4 mb-4">
                        <Icon name="bar-chart" className="text-brand-primary w-8 h-8"/>
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Análisis y Resumen Mensual</h2>
                            <p className="text-slate-500 text-sm">Comparativa inteligente de los pagos realizados históricamente.</p>
                        </div>
                    </div>

                    {analisisAgente && (
                        <div className="mb-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white border border-slate-200 border-l-4 border-l-brand-primary rounded-2xl p-6 shadow-sm text-slate-800">
                                <h3 className="text-sm font-bold text-brand-primary mb-4 uppercase tracking-widest flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    Reporte Financiero
                                </h3>

                                <div className="mb-6 border-b border-slate-200 pb-4">
                                    <p className="text-slate-500 text-sm mb-1">Comparando <span className="font-bold text-slate-900">{analisisAgente.mesActual}</span> vs <span className="font-bold text-slate-900">{analisisAgente.mesAnterior}</span></p>
                                    <div className="flex items-end gap-3">
                                        <div className={`text-4xl font-black ${analisisAgente.diferenciaTotal > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                            {analisisAgente.diferenciaTotal > 0 ? '+' : ''}{formatCurrency(analisisAgente.diferenciaTotal)}
                                        </div>
                                        <div className={`text-lg font-bold mb-1 px-2 py-0.5 rounded ${analisisAgente.diferenciaTotal > 0 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {analisisAgente.diferenciaTotal > 0 ? '↑' : '↓'} {Math.abs(analisisAgente.porcentaje)}%
                                        </div>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2">Diferencia Neta en el desembolso total de sueldos.</p>
                                </div>

                                <div className="space-y-3">
                                    <p className="text-xs font-bold text-slate-500 uppercase">Desglose de la Diferencia:</p>
                                    {analisisAgente.motivos.length === 0 ? (
                                        <p className="text-sm text-slate-500 italic">Los conceptos se mantuvieron estables.</p>
                                    ) : (
                                        analisisAgente.motivos.map((motivo, idx) => (
                                            <div key={idx} className="flex justify-between items-start text-sm">
                                                <div className="w-2/3">
                                                    <span className="font-semibold">{motivo.concepto}</span>
                                                    <p className="text-[10px] text-slate-500 leading-tight mt-0.5">{motivo.detalle}</p>
                                                </div>
                                                {motivo.impacto !== 0 && (
                                                    <span className={`font-mono font-bold ${motivo.impacto > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                        {motivo.impacto > 0 ? '+' : ''}{formatCurrency(motivo.impacto)}
                                                    </span>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            <div className="bg-pink-50 border border-pink-100 rounded-2xl p-6 shadow-inner">
                                <h3 className="text-sm font-bold text-brand-primary mb-4 uppercase tracking-widest flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                    Análisis de Personal
                                </h3>
                                
                                {analisisAgente.alertas.length === 0 ? (
                                    <div className="h-32 flex items-center justify-center text-center">
                                        <p className="text-pink-700 text-sm font-medium">No se detectaron variaciones significativas en los sueldos individuales.</p>
                                    </div>
                                ) : (
                                    <ul className="space-y-3 overflow-y-auto max-h-64 pr-2">
                                        {analisisAgente.alertas.map((alerta, idx) => (
                                            <li key={idx} className="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-bold text-slate-800">{alerta.nombre}</span>
                                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${alerta.variacion > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                        {alerta.tipo} ({alerta.porcentaje}%)
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-500">{alerta.detalle}</p>
                                                <p className="text-xs font-medium text-slate-700 mt-1">Diferencia neta: <span className={alerta.variacion > 0 ? 'text-emerald-600' : 'text-rose-600'}>{alerta.variacion > 0 ? '+' : ''}{formatCurrency(alerta.variacion)}</span></p>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                        </div>
                    )}

                    {analisisMensual.length === 0 ? (
                        <div className="text-center py-10 text-slate-400">
                            <p className="text-lg font-medium">Aún no hay liquidaciones guardadas.</p>
                            <p>Liquidá sueldos o premios para empezar a ver las estadísticas.</p>
                        </div>
                    ) : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-600 border-b-2 border-slate-300">
                                        <th className="py-3 px-4 font-bold">Período (Mes/Año)</th>
                                        <th className="py-3 px-4 font-bold text-center">Empleados Liquidados</th>
                                        <th className="py-3 px-4 font-bold text-right text-emerald-700">Total Haberes</th>
                                        <th className="py-3 px-4 font-bold text-right text-red-700">Total Deducciones</th>
                                        <th className="py-3 px-4 font-bold text-right text-red-500">Recupero Cta Cte</th>
                                        <th className="py-3 px-4 font-bold text-right text-brand-primary">NETO PAGADO</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {analisisMensual.map((fila, idx) => (
                                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                            <td className="py-3 px-4 font-black uppercase text-slate-700">{fila.periodo}</td>
                                            <td className="py-3 px-4 text-center font-semibold text-slate-600">{fila.cantEmpleados}</td>
                                            <td className="py-3 px-4 text-right font-medium text-emerald-600">{formatCurrency(fila.haberes)}</td>
                                            <td className="py-3 px-4 text-right font-medium text-red-600">{formatCurrency(fila.deducciones)}</td>
                                            <td className="py-3 px-4 text-right font-medium text-red-400">{formatCurrency(fila.ctaCte)}</td>
                                            <td className="py-3 px-4 text-right font-black text-brand-primary text-base">{formatCurrency(fila.neto)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        };

        // Períodos con el formato "Mes Año" (por ejemplo "Octubre 2026"), en horario de Argentina
        const NOMBRES_MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const periodoRelativo = (desplazamiento = 0) => {
            const [anio, mes] = Datos.partesAR().fecha.split('-').map(Number);
            const total = anio * 12 + (mes - 1) + desplazamiento;
            return `${NOMBRES_MESES[total % 12]} ${Math.floor(total / 12)}`;
        };

        // Lista desplegable de meses: desde 2 meses adelante hasta 2 años atrás, el más reciente primero
        const SelectorPeriodo = ({ value, onChange }) => {
            const opciones = useMemo(() => {
                const lista = [];
                for (let i = 2; i >= -24; i--) lista.push(periodoRelativo(i));
                // Si se edita una liquidación vieja con un período fuera de la lista, se conserva tal cual
                if (value && !lista.includes(value)) lista.unshift(value);
                return lista;
            }, [value]);
            return (
                <select name="periodo" value={value} onChange={onChange} className="w-full rounded-lg border-slate-300 border p-2.5 bg-slate-50 focus:ring-brand-primary">
                    {opciones.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
            );
        };

        const Liquidador = ({ empleados, editData, onSave, showToast, setPrintData }) => {
            const [formData, setFormData] = useState({
                empleadoId: '',
                tipoLiquidacion: 'Mensual',
                periodo: periodoRelativo(0),
                presentismo: 0,
                transporte: 0,
                premios: 0,
                conceptoPremio: 'Premios / Extras',
                aguinaldo: 0,
                sueldoBasicoManual: '',
                horasTotalesManual: '',
                descuentoCtaCte: 0,
                otrosDescuentos: 0,
                conceptoDescuento: 'Otros Descuentos'
            });

            const [diasTrabajados, setDiasTrabajados] = useState([]);
            const [isInitialLoad, setIsInitialLoad] = useState(true);

            useEffect(() => {
                if (editData && !editData.isPremio) {
                    setFormData({
                        empleadoId: editData.empleado.id,
                        tipoLiquidacion: editData.tipoLiquidacion,
                        periodo: editData.periodo,
                        presentismo: editData.presentismo,
                        transporte: editData.transporte,
                        premios: editData.premios,
                        conceptoPremio: editData.conceptoPremio || 'Premios / Extras',
                        aguinaldo: editData.aguinaldo,
                        sueldoBasicoManual: editData.sueldoBase || '',
                        horasTotalesManual: editData.totalHoras || '',
                        descuentoCtaCte: editData.descuentoCtaCte || 0,
                        otrosDescuentos: editData.otrosDescuentos || 0,
                        conceptoDescuento: editData.conceptoDescuento || 'Otros Descuentos'
                    });
                    setDiasTrabajados(editData.detalleDias || []);
                    setIsInitialLoad(false);
                }
            }, [editData]);

            useEffect(() => {
                if (isInitialLoad) return; 

                if (formData.empleadoId) {
                    const emp = empleados.find(e => e.id === parseInt(formData.empleadoId));
                    if (emp) {
                        if (formData.tipoLiquidacion === '1ra Quincena') {
                            setFormData(prev => ({ 
                                ...prev, 
                                presentismo: 0, 
                                transporte: 0,
                                aguinaldo: 0
                            }));
                        } else {
                            setFormData(prev => ({ 
                                ...prev, 
                                presentismo: emp.presentismoFijo || 0, 
                                transporte: emp.transporteFijo || 0 
                            }));
                        }
                    }
                }
            }, [formData.empleadoId, formData.tipoLiquidacion, empleados]);

            const handleChange = (e) => {
                setIsInitialLoad(false);
                setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            };

            const handlePaste = (e) => {
                e.preventDefault();
                const text = e.clipboardData.getData('text');
                if (!text) return;
                const lines = text.split('\n');
                const newDays = [];
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;
                    const parts = trimmed.split('\t').map(p => p.trim()).filter(p => p !== '');
                    if (parts.length >= 3) { 
                        const fechaRaw = parts[0];
                        if(fechaRaw.toLowerCase().includes('fecha') || fechaRaw.toLowerCase().includes('date')) return;
                        const horasStr = parts[1].replace(/\./g, '').replace(',', '.');
                        const montoStr = parts[2].replace(/\./g, '').replace(',', '.');
                        const horas = parseFloat(horasStr);
                        const monto = parseFloat(montoStr);
                        if (!isNaN(horas) && !isNaN(monto)) {
                            newDays.push({ id: Date.now() + Math.random(), fecha: fechaRaw, horas: horas, monto: monto, esFeriado: false });
                        }
                    }
                });
                if (newDays.length > 0) {
                    setDiasTrabajados(prev => [...prev, ...newDays]);
                    if(showToast) showToast(`¡Éxito! Se cargaron ${newDays.length} días desde el Excel.`, 'success');
                } else {
                    if(showToast) showToast('No detecté el formato. Asegurate de copiar solo las 3 columnas (Fecha, Horas, Monto) desde Excel.', 'error');
                }
            };

            // Trae las jornadas fichadas en el Módulo de Asistencias para el período elegido
            const [importando, setImportando] = useState(false);
            const importarDesdeAsistencias = async () => {
                const emp = empleados.find(e => e.id === parseInt(formData.empleadoId));
                if (!emp) {
                    showToast('Primero seleccioná un empleado.', 'error');
                    return;
                }
                const rango = Datos.rangoDePeriodo(formData.periodo, formData.tipoLiquidacion);
                if (!rango) {
                    showToast('No pude interpretar el período. Usá el formato "Mes Año", por ejemplo: Agosto 2026.', 'error');
                    return;
                }
                let fichajes;
                setImportando(true);
                try {
                    // Se trae un día extra de cada lado para no cortar jornadas que cruzan la medianoche
                    const { desde, hasta } = Datos.rangoEnMs(rango.desde, rango.hasta);
                    fichajes = await Datos.obtenerFichajes({ desde: desde - 86400000, hasta: hasta + 86400000 });
                } catch (err) {
                    showToast('No se pudieron leer las asistencias: ' + Datos.errorAmigable(err), 'error');
                    return;
                } finally {
                    setImportando(false);
                }
                const jornadas = Datos.calcularJornadas(fichajes.filter(f => f.empleadoId === emp.id))
                    .filter(j => j.fecha >= rango.desde && j.fecha <= rango.hasta);
                const completas = jornadas.filter(j => j.completa);
                const incompletas = jornadas.length - completas.length;
                if (completas.length === 0) {
                    showToast(`${emp.nombre} no tiene jornadas completas fichadas entre ${Datos.fechaCorta(rango.desde)} y ${Datos.fechaCorta(rango.hasta)}.`, 'error');
                    return;
                }

                const horasPorDia = {};
                completas.forEach(j => { horasPorDia[j.fecha] = (horasPorDia[j.fecha] || 0) + j.horas; });
                const valorHora = (Number(emp.sueldoBasico) || 0) / (Number(emp.horasBase) || 190);
                const dias = Object.keys(horasPorDia).sort().map((fecha, idx) => {
                    const horas = Math.round(horasPorDia[fecha] * 100) / 100;
                    return { id: Date.now() + idx, fecha: Datos.fechaCorta(fecha), horas, monto: Math.round(horas * valorHora * 100) / 100, esFeriado: false };
                });

                setIsInitialLoad(false);
                setDiasTrabajados(dias);
                showToast(`Se cargaron ${dias.length} días desde Asistencias (valor hora ${formatCurrency(valorHora)}).${incompletas ? ` Atención: ${incompletas} jornada(s) incompleta(s) no se incluyeron.` : ''}`, incompletas ? 'error' : 'success');
            };

            const actualizarDia = (id, campo, valor) => setDiasTrabajados(diasTrabajados.map(d => d.id === id ? { ...d, [campo]: valor } : d));
            const quitarDia = (id) => setDiasTrabajados(diasTrabajados.filter(d => d.id !== id));
            const agregarDiaManual = () => setDiasTrabajados([...diasTrabajados, { id: Date.now(), fecha: '', horas: '', monto: '', esFeriado: false }]);

            const calculos = useMemo(() => {
                if (!formData.empleadoId) return null;
                const empleado = empleados.find(e => e.id === parseInt(formData.empleadoId));
                let sueldoBase = 0;
                let totalHoras = 0;
                let detalleDiasFinal = [];

                if (diasTrabajados.length > 0) {
                    detalleDiasFinal = diasTrabajados.map(dia => {
                        let montoDia = parseFloat(dia.monto) || 0;
                        let hsDia = parseFloat(dia.horas) || 0;
                        if (dia.esFeriado) montoDia *= 2;
                        sueldoBase += montoDia;
                        totalHoras += hsDia;
                        return { ...dia, montoCalculado: montoDia };
                    });
                } else {
                    sueldoBase = parseFloat(formData.sueldoBasicoManual) || 0;
                    totalHoras = parseFloat(formData.horasTotalesManual) || 0;
                }

                const totalHaberes = sueldoBase + Number(formData.presentismo) + Number(formData.transporte) + Number(formData.premios) + Number(formData.aguinaldo);
                const totalDeducciones = Number(formData.descuentoCtaCte) + Number(formData.otrosDescuentos);
                const neto = totalHaberes - totalDeducciones;

                return { empleado, isPremio: false, sueldoBase, totalHoras, detalleDias: detalleDiasFinal, totalHaberes, totalDeducciones, neto, ...formData };
            }, [formData, diasTrabajados, empleados]);

            const triggerPrint = () => {
                setPrintData({ type: 'recibo', data: calculos, isPremio: false });
                setTimeout(() => window.print(), 100);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
                    <div className="lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-y-auto max-h-[85vh]">
                        <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <Icon name="calculator" className="text-brand-primary"/> Liquidador de Sueldos
                            {editData && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded ml-auto">Modo Edición</span>}
                        </h2>

                        <div className="space-y-5">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="col-span-2">
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Empleado</label>
                                    <select name="empleadoId" value={formData.empleadoId} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-brand-primary bg-slate-50">
                                        <option value="">Seleccione un empleado...</option>
                                        {empleados.map(emp => <option key={emp.id} value={emp.id}>{emp.nombre} ({emp.puesto})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo</label>
                                    <select name="tipoLiquidacion" value={formData.tipoLiquidacion} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2.5 bg-slate-50">
                                        <option value="Mensual">Mensual</option>
                                        <option value="1ra Quincena">1ra Quincena</option>
                                        <option value="2da Quincena">2da Quincena</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Período (Mes)</label>
                                    <SelectorPeriodo value={formData.periodo} onChange={handleChange} />
                                </div>
                            </div>

                            <div className="border-t border-slate-200 pt-5">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-sm font-bold text-brand-primary uppercase tracking-wider">Carga de Días Trabajados</h3>
                                    <button type="button" onClick={importarDesdeAsistencias} disabled={importando} className="flex items-center gap-1.5 text-xs font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg hover:bg-slate-700 transition-colors shadow-sm disabled:opacity-60">
                                        <Icon name="clock" className="w-4 h-4"/> {importando ? 'Buscando...' : 'Traer desde Asistencias'}
                                    </button>
                                </div>
                                
                                <div className="mb-4">
                                    <label className="block text-xs font-bold text-emerald-700 uppercase mb-2 text-center border-b border-emerald-100 pb-2">
                                        📥 Extracción Directa desde Excel
                                    </label>
                                    <textarea 
                                        onPaste={handlePaste}
                                        placeholder="Hacé clic acá adentro y presioná Ctrl + V para PEGAR las filas que copiaste de tu Excel..."
                                        className="w-full h-20 border-2 border-dashed border-emerald-400 rounded-xl p-4 text-sm font-medium text-slate-700 bg-emerald-50 hover:bg-emerald-100 focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-200 resize-none transition-all shadow-inner"
                                    ></textarea>
                                </div>

                                {diasTrabajados.length > 0 && (
                                    <div className="space-y-2 max-h-64 overflow-y-auto pr-1 mb-4 border border-slate-200 p-2 rounded-xl bg-slate-50">
                                        {diasTrabajados.map((dia) => (
                                            <div key={dia.id} className="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
                                                <div className="flex-1">
                                                    <input type="text" value={dia.fecha} onChange={e => actualizarDia(dia.id, 'fecha', e.target.value)} className="w-full text-sm font-bold text-slate-700 p-1.5 border border-slate-300 rounded bg-slate-100" />
                                                </div>
                                                <div className="w-20">
                                                    <input type="number" step="0.01" value={dia.horas} onChange={e => actualizarDia(dia.id, 'horas', e.target.value)} className="w-full text-sm font-semibold p-1.5 border border-brand-primary rounded bg-white" />
                                                </div>
                                                <div className="w-24">
                                                    <input type="number" step="0.01" value={dia.monto} onChange={e => actualizarDia(dia.id, 'monto', e.target.value)} className="w-full text-sm font-semibold p-1.5 border border-emerald-300 rounded bg-white text-emerald-800" />
                                                </div>
                                                <div className="w-16 flex justify-center">
                                                    <label className="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer">
                                                        <input type="checkbox" checked={dia.esFeriado} onChange={e => actualizarDia(dia.id, 'esFeriado', e.target.checked)} className="rounded text-brand-primary w-3 h-3" /> FER.
                                                    </label>
                                                </div>
                                                <button type="button" onClick={() => quitarDia(dia.id)} className="p-1 text-red-400 hover:text-red-600 hover:bg-red-50 rounded">
                                                    <Icon name="x" className="w-4 h-4"/>
                                                </button>
                                            </div>
                                        ))}
                                        <button type="button" onClick={agregarDiaManual} className="w-full mt-2 py-1.5 bg-slate-200 text-slate-600 font-semibold text-xs rounded-lg hover:bg-slate-300 transition-colors">
                                            + Agregar Renglón Vacío
                                        </button>
                                    </div>
                                )}
                                
                                {diasTrabajados.length === 0 && (
                                    <div className="mt-4 bg-pink-50 p-4 rounded-xl border border-pink-200 shadow-sm">
                                        <h4 className="text-sm font-bold text-brand-primary mb-3 border-b border-pink-200 pb-2">Opcional: Carga Global (Totales Rápidos)</h4>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-pink-800 mb-1">Total Horas Trabajadas</label>
                                                <input type="number" step="0.01" name="horasTotalesManual" value={formData.horasTotalesManual} onChange={handleChange} className="w-full rounded-lg border-pink-300 p-2.5 focus:ring-brand-primary bg-white shadow-inner" placeholder="Ej: 194.12" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-pink-800 mb-1">Monto Total a Pagar ($)</label>
                                                <input type="number" step="0.01" name="sueldoBasicoManual" value={formData.sueldoBasicoManual} onChange={handleChange} className="w-full rounded-lg border-pink-300 p-2.5 font-bold focus:ring-brand-primary bg-white text-pink-900 shadow-inner" placeholder="Ej: 766268.95" />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="border-t border-slate-200 pt-5">
                                <h3 className="text-sm font-bold text-emerald-700 mb-4 uppercase tracking-wider flex justify-between items-center">
                                    Adicionales (Suman)
                                    {formData.tipoLiquidacion === '1ra Quincena' && <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-1 rounded">Los valores se pusieron a $0, pero podés editarlos manualmente.</span>}
                                </h3>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Presentismo ($)</label>
                                            <input type="number" name="presentismo" value={formData.presentismo} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Transporte / SUBE ($)</label>
                                            <input type="number" name="transporte" value={formData.transporte} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">S.A.C. (Aguinaldo) ($)</label>
                                            <input type="number" name="aguinaldo" value={formData.aguinaldo} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Concepto Extra</label>
                                            <input type="text" name="conceptoPremio" value={formData.conceptoPremio} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2 text-sm" placeholder="Ej: Bono"/>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Monto Extra ($)</label>
                                            <input type="number" name="premios" value={formData.premios} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="border-t border-slate-200 pt-5">
                                <h3 className="text-sm font-bold text-red-700 mb-3 uppercase tracking-wider">Descuentos (Restan)</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Descuento Cuenta Corriente ($)</label>
                                        <input type="number" name="descuentoCtaCte" value={formData.descuentoCtaCte} onChange={handleChange} className="w-full rounded-lg border-red-200 border p-2.5 bg-red-50 focus:ring-red-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Concepto Descuento</label>
                                            <input type="text" name="conceptoDescuento" value={formData.conceptoDescuento} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2 text-sm" placeholder="Ej: Rotura"/>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Monto Descuento ($)</label>
                                            <input type="number" name="otrosDescuentos" value={formData.otrosDescuentos} onChange={handleChange} className="w-full rounded-lg border-red-200 border p-2 bg-red-50 focus:ring-red-500" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {calculos && (
                                <div className="border-t-2 border-slate-200 pt-6 mt-2">
                                    <div className="flex justify-between items-center bg-pink-50 p-5 rounded-xl border border-pink-200">
                                        <span className="font-bold text-brand-primary tracking-wide">NETO A PAGAR:</span>
                                        <span className="text-3xl font-black text-brand-primary">{formatCurrency(calculos.neto)}</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mt-5">
                                        <button onClick={() => onSave(calculos)} className="flex items-center justify-center gap-2 bg-white border-2 border-brand-primary text-brand-primary font-bold py-3 rounded-xl hover:bg-pink-50 transition-colors shadow-sm">
                                            <Icon name="save"/> {editData ? 'Guardar Cambios' : 'Guardar Nuevo'}
                                        </button>
                                        <button onClick={triggerPrint} className="flex items-center justify-center gap-2 bg-brand-primary text-white font-bold py-3 rounded-xl hover:bg-opacity-90 transition-colors shadow-md">
                                            <Icon name="printer"/> Imprimir recibo
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="lg:col-span-7 relative">
                        {calculos ? (
                            <div className="bg-slate-300 p-8 rounded-2xl shadow-inner overflow-x-auto h-[85vh] flex justify-center">
                                <div className="transform scale-95 origin-top w-full max-w-2xl">
                                    <Recibo recibo={calculos} isPremio={false} tipo="ORIGINAL (VISTA PREVIA)" />
                                </div>
                            </div>
                        ) : (
                            <div className="h-full border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center text-slate-400 p-10 bg-white/50">
                                <Icon name="calculator" className="w-16 h-16 mb-4 text-slate-300"/>
                                <p className="font-medium text-lg">Seleccioná un empleado para calcular su sueldo</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LiquidadorPremios = ({ empleados, editData, onSave, setPrintData }) => {
            const [formData, setFormData] = useState({
                empleadoId: '',
                periodo: periodoRelativo(0),
                otrosDescuentos: 0,
                conceptoDescuento: 'Otros Descuentos',
                montoAdicional: 0,
                conceptoAdicional: 'Adicional Extra',
                tipoPremio: 'vendedor'
            });

            const [comisiones, setComisiones] = useState([
                { id: 1, concepto: 'Ventas Berazategui', montoVendido: '', porcentaje: '5' }
            ]);
            const [cantidadPedidos, setCantidadPedidos] = useState('');
            const [modoEdicionEscala, setModoEdicionEscala] = useState(false);
            const [escalasArmador, setEscalasArmador] = useState([
                { id: 1, ped: 50, monto: 40000 },
                { id: 2, ped: 80, monto: 50000 },
                { id: 3, ped: 110, monto: 60000 },
                { id: 4, ped: 140, monto: 70000 },
                { id: 5, ped: 160, monto: 80000 }
            ]);

            useEffect(() => {
                if (editData && editData.isPremio) {
                    setFormData({
                        empleadoId: editData.empleado.id,
                        periodo: editData.periodo,
                        otrosDescuentos: editData.otrosDescuentos || 0,
                        conceptoDescuento: editData.conceptoDescuento || 'Otros Descuentos',
                        montoAdicional: editData.montoAdicional || 0,
                        conceptoAdicional: editData.conceptoAdicional || 'Adicional Extra',
                        tipoPremio: editData.tipoPremio || 'vendedor'
                    });
                    if (editData.comisiones) setComisiones(editData.comisiones);
                    if (editData.cantidadPedidos) setCantidadPedidos(editData.cantidadPedidos);
                    if (editData.escalasArmador) setEscalasArmador(editData.escalasArmador);
                }
            }, [editData]);

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            const actualizarComision = (id, campo, valor) => setComisiones(comisiones.map(c => c.id === id ? { ...c, [campo]: valor } : c));
            const agregarComision = () => setComisiones([...comisiones, { id: Date.now(), concepto: '', montoVendido: '', porcentaje: '' }]);
            const quitarComision = (id) => setComisiones(comisiones.filter(c => c.id !== id));
            const actualizarEscala = (id, campo, valor) => setEscalasArmador(escalasArmador.map(e => e.id === id ? { ...e, [campo]: valor } : e));
            const agregarEscala = () => setEscalasArmador([...escalasArmador, { id: Date.now(), ped: '', monto: '' }]);
            const quitarEscala = (id) => setEscalasArmador(escalasArmador.filter(e => e.id !== id));

            const calculos = useMemo(() => {
                if (!formData.empleadoId) return null;
                const empleado = empleados.find(e => e.id === parseInt(formData.empleadoId));
                let detallePremios = [];
                let totalHaberes = 0;

                if (formData.tipoPremio === 'vendedor') {
                    comisiones.forEach(com => {
                        const monto = Number(com.montoVendido) || 0;
                        const porc = Number(com.porcentaje) || 0;
                        const ganancia = monto * (porc / 100);
                        if (ganancia > 0) {
                            detallePremios.push({ concepto: `Comisión ${porc}% - ${com.concepto || 'Ventas'}`, monto: ganancia });
                            totalHaberes += ganancia;
                        }
                    });
                } else if (formData.tipoPremio === 'armador') {
                    const pedidos = Number(cantidadPedidos) || 0;
                    escalasArmador.forEach(escala => {
                        const pedRequeridos = Number(escala.ped) || 0;
                        const montoPremio = Number(escala.monto) || 0;
                        if (pedRequeridos > 0 && pedidos >= pedRequeridos) {
                            detallePremios.push({ concepto: `Premio Armado x ${pedRequeridos} Pedidos`, monto: montoPremio });
                            totalHaberes += montoPremio;
                        }
                    });
                }

                const adicionalManual = Number(formData.montoAdicional) || 0;
                if (adicionalManual > 0) {
                    detallePremios.push({ concepto: formData.conceptoAdicional || 'Adicional Extra', monto: adicionalManual });
                    totalHaberes += adicionalManual;
                }

                const totalDeducciones = Number(formData.otrosDescuentos);
                const neto = totalHaberes - totalDeducciones;

                return {
                    empleado, isPremio: true, detallePremios, totalHaberes, totalDeducciones, neto,
                    ...formData, sueldoBase: 0, presentismo: 0, aguinaldo: 0, premios: totalHaberes, totalHoras: 0, tipoLiquidacion: 'Premios',
                    comisiones, cantidadPedidos, escalasArmador
                };
            }, [formData, comisiones, cantidadPedidos, escalasArmador, empleados]);

            const triggerPrint = () => {
                setPrintData({ type: 'recibo', data: calculos, isPremio: true });
                setTimeout(() => window.print(), 100);
            };

            return (
                <div>
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
                        <div className="lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-y-auto max-h-[85vh]">
                            <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                                <Icon name="award" className="text-brand-primary"/> Liquidador de Premios
                                {editData && <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded ml-auto">Modo Edición</span>}
                            </h2>

                            <div className="space-y-5">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2">
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Empleado</label>
                                        <select name="empleadoId" value={formData.empleadoId} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-brand-primary bg-slate-50">
                                            <option value="">Seleccione un empleado...</option>
                                            {empleados.map(emp => <option key={emp.id} value={emp.id}>{emp.nombre} ({emp.puesto})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo de Premio</label>
                                        <select name="tipoPremio" value={formData.tipoPremio} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2.5 bg-pink-50 focus:ring-brand-primary">
                                            <option value="vendedor">Vendedor/a</option>
                                            <option value="armador">Armador/a</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Período (Mes)</label>
                                        <SelectorPeriodo value={formData.periodo} onChange={handleChange} />
                                    </div>
                                </div>

                                <div className="border-t border-slate-200 pt-5">
