                                    <h3 className="text-sm font-bold text-brand-primary mb-4 uppercase tracking-wider">Detalle de Premios</h3>
                                    
                                    {formData.tipoPremio === 'vendedor' && (
                                        <div className="space-y-3 bg-pink-50/30 p-4 rounded-xl border border-pink-200">
                                            {comisiones.map(com => (
                                                <div key={com.id} className="flex flex-wrap sm:flex-nowrap gap-2 items-center bg-white p-3 rounded-lg border border-pink-100 shadow-sm relative">
                                                    <div className="w-full sm:flex-1">
                                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Mayorista / Concepto</label>
                                                        <input type="text" value={com.concepto} onChange={e => actualizarComision(com.id, 'concepto', e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-brand-primary" placeholder="Ej: Mayorista Z" />
                                                    </div>
                                                    <div className="w-full sm:w-32">
                                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Vendido ($)</label>
                                                        <input type="number" step="0.01" value={com.montoVendido} onChange={e => actualizarComision(com.id, 'montoVendido', e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-brand-primary" placeholder="Monto" />
                                                    </div>
                                                    <div className="w-full sm:w-16">
                                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Comis. %</label>
                                                        <input type="number" step="0.01" value={com.porcentaje} onChange={e => actualizarComision(com.id, 'porcentaje', e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-brand-primary" placeholder="Ej: 5" />
                                                    </div>
                                                    <div className="w-full sm:w-28 bg-pink-100/60 border border-pink-200 rounded-lg p-1.5 flex flex-col justify-center items-center">
                                                        <label className="block text-[9px] font-black text-brand-primary uppercase mb-0.5">Ganancia</label>
                                                        <span className="text-sm font-bold text-brand-primary">{formatCurrency((Number(com.montoVendido) || 0) * ((Number(com.porcentaje) || 0) / 100))}</span>
                                                    </div>
                                                    {comisiones.length > 1 && (
                                                        <button type="button" onClick={() => quitarComision(com.id)} className="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 border border-red-200 hover:bg-red-200 transition-colors shadow-sm" title="Eliminar">
                                                            <Icon name="x" className="w-4 h-4"/>
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                            <button type="button" onClick={agregarComision} className="w-full py-2.5 mt-2 bg-pink-100 text-brand-primary font-bold text-xs uppercase tracking-wide rounded-lg hover:bg-pink-200 border border-pink-300 border-dashed transition-colors">
                                                + Agregar Otra Comisión
                                            </button>
                                        </div>
                                    )}

                                    {formData.tipoPremio === 'armador' && (
                                        <div className="space-y-4 bg-pink-50/30 p-5 rounded-xl border border-pink-200">
                                            <div>
                                                <label className="block text-sm font-black text-slate-800 mb-2">Cantidad Total de Pedidos Armados</label>
                                                <input type="number" value={cantidadPedidos} onChange={e => setCantidadPedidos(e.target.value)} className="w-full rounded-xl border-slate-300 border p-4 font-black text-2xl text-brand-primary focus:ring-brand-primary bg-white shadow-inner" placeholder="Ej: 165" />
                                            </div>
                                            
                                            <div className="mt-4">
                                                <div className="flex justify-between items-center mb-3">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Escala de Premios</label>
                                                    <button type="button" onClick={() => setModoEdicionEscala(!modoEdicionEscala)} className="text-xs font-bold text-brand-primary hover:text-pink-900 bg-pink-100 hover:bg-pink-200 px-3 py-1.5 rounded-lg border border-pink-200 transition-colors shadow-sm">
                                                        {modoEdicionEscala ? '✓ Guardar Cambios' : '⚙️ Editar Escala'}
                                                    </button>
                                                </div>

                                                {modoEdicionEscala ? (
                                                    <div className="space-y-2 bg-white p-4 rounded-xl border border-slate-200 shadow-inner">
                                                        {escalasArmador.map((escala) => (
                                                            <div key={escala.id} className="flex gap-2 items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                                <div className="flex-1">
                                                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Pedidos (Mínimo)</label>
                                                                    <input type="number" value={escala.ped} onChange={e => actualizarEscala(escala.id, 'ped', e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-brand-primary" placeholder="Ej: 50" />
                                                                </div>
                                                                <div className="flex-1">
                                                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Premio a sumar ($)</label>
                                                                    <input type="number" step="0.01" value={escala.monto} onChange={e => actualizarEscala(escala.id, 'monto', e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-brand-primary" placeholder="Monto" />
                                                                </div>
                                                                <button type="button" onClick={() => quitarEscala(escala.id)} className="mt-5 p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                                                    <Icon name="x" className="w-5 h-5"/>
                                                                </button>
                                                            </div>
                                                        ))}
                                                        <button type="button" onClick={agregarEscala} className="w-full py-2.5 mt-2 bg-slate-100 text-slate-600 font-bold text-xs uppercase tracking-wide rounded-lg hover:bg-slate-200 border border-slate-300 border-dashed transition-colors">
                                                            + Agregar Nuevo Nivel
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 select-none">
                                                        {escalasArmador.map((nivel) => {
                                                            const req = Number(nivel.ped) || 0;
                                                            const monto = Number(nivel.monto) || 0;
                                                            const alcanzado = Number(cantidadPedidos) >= req && req > 0;
                                                            return (
                                                                <div key={nivel.id} className={`p-2 rounded-lg border-2 text-center transition-all ${alcanzado ? 'bg-emerald-100 border-emerald-400 text-emerald-900 shadow-sm transform scale-105' : 'bg-slate-100 border-slate-200 text-slate-400 opacity-60'}`}>
                                                                    <div className="text-[11px] font-black uppercase">{req} Ped.</div>
                                                                    <div className="text-sm font-bold">{(monto / 1000).toFixed(0)}k</div>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="border-t border-slate-200 pt-5">
                                    <h3 className="text-sm font-bold text-emerald-700 mb-3 uppercase tracking-wider">Adicionales Extra (Suman)</h3>
                                    <div className="space-y-3">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Concepto Adicional</label>
                                                <input type="text" name="conceptoAdicional" value={formData.conceptoAdicional} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2 text-xs" placeholder="Ej: Bono por esfuerzo" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Monto a sumar ($)</label>
                                                <input type="number" name="montoAdicional" value={formData.montoAdicional} onChange={handleChange} className="w-full rounded-lg border-emerald-200 border p-2 bg-emerald-50 focus:ring-emerald-500" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="border-t border-slate-200 pt-5">
                                    <h3 className="text-sm font-bold text-red-700 mb-3 uppercase tracking-wider">Descuentos</h3>
                                    <div className="space-y-3">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Concepto Descuento sobre Premio</label>
                                                <input type="text" name="conceptoDescuento" value={formData.conceptoDescuento} onChange={handleChange} className="w-full rounded-lg border-slate-300 border p-2 text-xs" placeholder="Ej: Rotura de mercadería" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Monto a descontar ($)</label>
                                                <input type="number" name="otrosDescuentos" value={formData.otrosDescuentos} onChange={handleChange} className="w-full rounded-lg border-red-200 border p-2 bg-red-50 focus:ring-red-500" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {calculos && (
                                    <div className="border-t-2 border-slate-200 pt-6 mt-2">
                                        <div className="flex justify-between items-center bg-pink-50 p-5 rounded-xl border border-pink-200">
                                            <span className="font-bold text-brand-primary tracking-wide">TOTAL PREMIOS:</span>
                                            <span className="text-3xl font-black text-brand-primary">{formatCurrency(calculos.neto)}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 mt-5">
                                            <button onClick={() => onSave(calculos)} className="flex items-center justify-center gap-2 bg-white border-2 border-brand-primary text-brand-primary font-bold py-3 rounded-xl hover:bg-pink-50 transition-colors shadow-sm">
                                                <Icon name="save"/> {editData ? 'Guardar Cambios' : 'Guardar Nuevo'}
                                            </button>
                                            <button onClick={triggerPrint} className="flex items-center justify-center gap-2 bg-brand-primary text-white font-bold py-3 rounded-xl hover:bg-opacity-90 transition-colors shadow-md">
                                                <Icon name="printer"/> Imprimir recibo
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="lg:col-span-7 relative">
                            {calculos ? (
                                <div className="bg-slate-300 p-8 rounded-2xl shadow-inner overflow-x-auto min-h-[600px] flex justify-center">
                                    <div className="transform scale-95 origin-top w-full max-w-2xl">
                                        <Recibo recibo={calculos} isPremio={true} tipo="ORIGINAL (VISTA PREVIA)" />
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center text-slate-400 p-10 bg-white/50">
                                    <Icon name="award" className="w-16 h-16 mb-4 text-slate-300"/>
                                    <p className="font-medium text-lg">Seleccioná un empleado para calcular sus premios</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const SeccionInformes = ({ historial, empleados, setPrintData, handleDelete, handleEdit, handleUpdateNota }) => {
            const [subVista, setSubVista] = useState('mensual');
            const [filtroMes, setFiltroMes] = useState('');
            const [filtroEmp, setFiltroEmp] = useState('');
            const [busqueda, setBusqueda] = useState('');

            const periodosDisponibles = useMemo(() => {
                const periodos = historial.map(h => h.periodo);
                return [...new Set(periodos)].sort();
            }, [historial]);

            useEffect(() => {
                if (periodosDisponibles.length > 0 && !filtroMes) setFiltroMes(periodosDisponibles[periodosDisponibles.length - 1]);
            }, [periodosDisponibles, filtroMes]);

            const handleUpdateNotaMensual = (empId, periodo, nota) => {
                const recibo = historial.find(h => h.empleado.id === empId && h.periodo === periodo && !h.isPremio);
                if (recibo) {
                    handleUpdateNota(recibo.idGuardado, nota);
                }
            };

            const datosInforme = useMemo(() => {
                if (!filtroMes) return [];
                const recibosDelMes = historial.filter(h => h.periodo === filtroMes);
                const consolidado = {};
                
                empleados.forEach(emp => {
                    consolidado[emp.id] = { id: emp.id, nombre: emp.nombre, horasBase: emp.horasBase || 190, mensual: 0, q1: 0, q2: 0, presentismo: 0, aguinaldo: 0, premios: 0, ctaCte: 0, otrosDesc: 0, total: 0, horas: 0, observacion: '' };
                });

                recibosDelMes.forEach(r => {
                    if (!consolidado[r.empleado.id]) return;
                    const e = consolidado[r.empleado.id];
                    if (r.tipoLiquidacion === '1ra Quincena') e.q1 += r.sueldoBase;
                    else if (r.tipoLiquidacion === '2da Quincena') e.q2 += r.sueldoBase;
                    else e.mensual += r.sueldoBase;
                    
                    e.presentismo += Number(r.presentismo) || 0;
                    e.aguinaldo += Number(r.aguinaldo) || 0;
                    e.premios += Number(r.premios) || 0;
                    e.horas += Number(r.totalHoras) || 0;
                    e.ctaCte += Number(r.descuentoCtaCte) || 0;
                    e.otrosDesc += Number(r.otrosDescuentos) || 0;
                    e.total += r.neto;
                    
                    if (r.observacion) e.observacion = r.observacion; 
                });
                return Object.values(consolidado).filter(d => d.total > 0 || d.ctaCte > 0 || d.otrosDesc > 0);
            }, [historial, filtroMes, empleados]);

            const historialFiltrado = useMemo(() => {
                return historial.filter(h => {
                    const matchMes = filtroMes ? h.periodo === filtroMes : true;
                    const matchName = h.empleado.nombre.toLowerCase().includes(busqueda.toLowerCase());
                    return matchMes && matchName;
                }).sort((a, b) => {
                     // Sort by idGuardado descending, but handle potential string IDs from Firebase
                     const idA = typeof a.idGuardado === 'string' ? a.idGuardado : a.idGuardado;
                     const idB = typeof b.idGuardado === 'string' ? b.idGuardado : b.idGuardado;
                     if(idA < idB) return 1;
                     if(idA > idB) return -1;
                     return 0;
                });
            }, [historial, filtroMes, busqueda]);

            const statsHistorial = useMemo(() => {
                return historialFiltrado.reduce((acc, curr) => {
                    acc.totalNeto += curr.neto || 0;
                    acc.totalHaberes += curr.totalHaberes || 0;
                    acc.totalDeducciones += curr.totalDeducciones || 0;
                    return acc;
                }, { totalNeto: 0, totalHaberes: 0, totalDeducciones: 0 });
            }, [historialFiltrado]);

            const datosEmpleado = useMemo(() => {
                if (!filtroEmp) return null;
                const recibos = historial.filter(h => h.empleado.id === parseInt(filtroEmp)).sort((a, b) => {
                     const idA = typeof a.idGuardado === 'string' ? a.idGuardado : a.idGuardado;
                     const idB = typeof b.idGuardado === 'string' ? b.idGuardado : b.idGuardado;
                     if(idA < idB) return 1;
                     if(idA > idB) return -1;
                     return 0;
                });
                const totales = recibos.reduce((acc, r) => {
                    acc.neto += r.neto;
                    acc.haberes += r.totalHaberes;
                    acc.deducciones += r.totalDeducciones;
                    return acc;
                }, { neto: 0, haberes: 0, deducciones: 0 });
                const promedio = recibos.length > 0 ? totales.neto / recibos.length : 0;
                return { recibos, totales, promedio };
            }, [historial, filtroEmp]);

            return (
                <div className="space-y-6 max-w-[1400px] mx-auto">
                    <div className="flex flex-wrap gap-2 mb-2 bg-white p-2 rounded-xl border border-slate-200 shadow-sm items-center justify-between">
                        <div className="flex gap-2">
                            <button onClick={() => setSubVista('mensual')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors ${subVista === 'mensual' ? 'bg-pink-100 text-brand-primary' : 'text-slate-500 hover:bg-slate-100'}`}>Reporte Mensual General</button>
                            <button onClick={() => setSubVista('empleado')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors ${subVista === 'empleado' ? 'bg-pink-100 text-brand-primary' : 'text-slate-500 hover:bg-slate-100'}`}>Análisis por Empleado</button>
                        </div>
                        <button onClick={() => setSubVista('historial')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors flex items-center gap-2 ${subVista === 'historial' ? 'bg-emerald-600 text-white' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'}`}>
                            <Icon name="edit" className="w-4 h-4"/> Gestión y Edición de Recibos
                        </button>
                    </div>

                    {subVista === 'mensual' && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                            <div className="flex justify-between items-center p-6 border-b border-slate-200">
                                <div className="flex items-center gap-4">
                                    <label className="font-bold text-slate-700">Período:</label>
                                    <select value={filtroMes} onChange={e => setFiltroMes(e.target.value)} className="rounded-lg border-slate-300 border p-2 bg-slate-50 focus:ring-2 focus:ring-brand-primary font-semibold outline-none">
                                        <option value="">Seleccione...</option>
                                        {periodosDisponibles.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <button onClick={() => { 
                                    const originalTitle = document.title;
                                    document.title = `Reporte_${filtroMes.replace(' ', '_')}`;
                                    setPrintData({ type: 'informe', mes: filtroMes, datos: datosInforme }); 
                                    setTimeout(() => window.print(), 100); 
                                    document.title = originalTitle;
                                }} className="flex items-center justify-center gap-2 bg-emerald-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-emerald-700 transition-colors shadow-md">
                                    <Icon name="printer" className="w-5 h-5" /> Exportar a PDF
                                </button>
                            </div>
                            
                            <div className="overflow-x-auto p-6 bg-slate-50/50">
                                <table className="w-full text-left text-sm border-collapse border border-slate-300 bg-white">
                                    <thead>
                                        <tr className="bg-slate-200 border-y-2 border-slate-300 text-slate-800">
                                            <th className="py-3 px-3 font-bold border-x border-slate-300 min-w-[120px]">NOMBRE</th>
                                            <th className="py-3 px-3 font-bold text-center border-x border-slate-300 w-24">HS MES</th>
                                            <th className="py-3 px-3 font-bold text-center border-x border-slate-300 bg-emerald-50 text-emerald-800" colSpan="5">HABERES (SUMAN)</th>
                                            <th className="py-3 px-3 font-bold text-center border-x border-slate-300 bg-red-50 text-red-800" colSpan="2">DEDUCCIONES (RESTAN)</th>
                                            <th className="py-3 px-3 font-black text-center border-x border-slate-300 bg-pink-100 text-pink-900 w-32">TOTAL NETO</th>
                                            <th className="py-3 px-3 font-bold text-left border-x border-slate-300 bg-slate-50 text-slate-800 min-w-[150px]">OBSERVACIONES</th>
                                        </tr>
                                        <tr className="bg-slate-100 border-b-2 border-slate-300 text-[10px] uppercase text-slate-500">
                                            <th className="py-1.5 px-3 border-x border-slate-300"></th>
                                            <th className="py-1.5 px-3 border-x border-slate-300 text-center">Estado</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-emerald-50/50">Básico/Men</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-emerald-50/50">Quincenas</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-emerald-50/50">Presentismo</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-emerald-50/50">Aguinaldo</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-emerald-50/50">Premios/Ext</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-red-50/50">Cta Cte</th>
                                            <th className="py-1.5 px-3 text-right font-semibold border-x border-slate-300 bg-red-50/50">Otros Desc.</th>
                                            <th className="py-1.5 px-3 border-x border-slate-300 bg-pink-50/50"></th>
                                            <th className="py-1.5 px-3 border-x border-slate-300 bg-slate-50">Edición manual</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {datosInforme.length === 0 ? (
                                            <tr><td colSpan="11" className="py-12 text-center text-slate-500 font-medium">No hay liquidaciones para este período.</td></tr>
                                        ) : (
                                            datosInforme.map((fila, idx) => {
                                                const dif = fila.horas - (fila.horasBase || 190);
                                                return (
                                                    <tr key={idx} className="border-b border-slate-200 hover:bg-slate-50">
                                                        <td className="py-2 px-3 font-bold text-slate-800 border-x border-slate-200">{fila.nombre}</td>
                                                        <td className="py-2 px-2 text-center border-x border-slate-200 bg-slate-50">
                                                            <div className="font-bold text-slate-700 leading-none">{fila.horas}h</div>
                                                            {dif > 0 && <div className="text-[10px] text-emerald-600 font-bold bg-emerald-100 rounded px-1 mt-1 inline-block leading-tight" title={`Hizo ${dif} horas más que las ${fila.horasBase || 190} establecidas`}>+{dif}h extra</div>}
                                                            {dif < 0 && <div className="text-[10px] text-red-600 font-bold bg-red-100 rounded px-1 mt-1 inline-block leading-tight" title={`Le faltaron ${Math.abs(dif)} horas para llegar a ${fila.horasBase || 190}`}>{dif}h falta</div>}
                                                            {dif === 0 && <div className="text-[10px] text-slate-400 font-bold bg-slate-200 rounded px-1 mt-1 inline-block leading-tight">OK</div>}
                                                        </td>
                                                        <td className="py-2 px-3 text-right border-x border-slate-200 text-slate-600">{formatCurrency(fila.mensual)}</td>
                                                        <td className="py-2 px-3 text-right border-x border-slate-200 text-slate-600">{formatCurrency(fila.q1 + fila.q2)}</td>
                                                        <td className="py-2 px-3 text-right border-x border-slate-200 text-slate-600">{formatCurrency(fila.presentismo)}</td>
                                                        <td className="py-2 px-3 text-right border-x border-slate-200 text-slate-600">{formatCurrency(fila.aguinaldo)}</td>
                                                        <td className="py-2 px-3 text-right border-x border-slate-200 text-slate-600">{formatCurrency(fila.premios)}</td>
                                                        <td className="py-2 px-3 text-right text-red-600 font-medium border-x border-slate-200">{formatCurrency(fila.ctaCte)}</td>
                                                        <td className="py-2 px-3 text-right text-red-600 font-medium border-x border-slate-200">{formatCurrency(fila.otrosDesc)}</td>
                                                        <td className="py-2 px-3 text-right font-black text-brand-primary bg-pink-50 border-x border-slate-200">{formatCurrency(fila.total)}</td>
                                                        <td className="py-2 px-3 text-left border-x border-slate-200 bg-slate-50">
                                                            <input 
                                                                type="text"
                                                                value={fila.observacion || ''}
                                                                onChange={(e) => handleUpdateNotaMensual(fila.id, filtroMes, e.target.value)}
                                                                placeholder={dif > 0 ? 'Horas extras...' : (dif < 0 ? 'Ausentismo...' : 'Sin novedades')}
                                                                className="w-full text-[11px] p-1.5 border border-transparent hover:border-slate-300 focus:border-brand-primary focus:bg-white bg-slate-100 rounded outline-none transition-colors"
                                                            />
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                    {datosInforme.length > 0 && (
                                        <tfoot>
                                            <tr className="bg-pink-50 text-slate-900 font-bold border-t-2 border-brand-primary">
                                                <td className="py-4 px-3">TOTALES DEL MES</td>
                                                <td className="py-4 px-3 text-center text-slate-500">{datosInforme.reduce((a, b) => a + b.horas, 0)} hs</td>
                                                <td className="py-4 px-3 text-right">{formatCurrency(datosInforme.reduce((a, b) => a + b.mensual, 0))}</td>
                                                <td className="py-4 px-3 text-right">{formatCurrency(datosInforme.reduce((a, b) => a + b.q1 + b.q2, 0))}</td>
                                                <td className="py-4 px-3 text-right">{formatCurrency(datosInforme.reduce((a, b) => a + b.presentismo, 0))}</td>
                                                <td className="py-4 px-3 text-right">{formatCurrency(datosInforme.reduce((a, b) => a + b.aguinaldo, 0))}</td>
                                                <td className="py-4 px-3 text-right">{formatCurrency(datosInforme.reduce((a, b) => a + b.premios, 0))}</td>
                                                <td className="py-4 px-3 text-right text-red-700">{formatCurrency(datosInforme.reduce((a, b) => a + b.ctaCte, 0))}</td>
                                                <td className="py-4 px-3 text-right text-red-700">{formatCurrency(datosInforme.reduce((a, b) => a + b.otrosDesc, 0))}</td>
                                                <td className="py-4 px-3 text-right text-lg text-brand-primary font-black">{formatCurrency(datosInforme.reduce((a, b) => a + b.total, 0))}</td>
                                                <td className="py-4 px-3"></td>
                                            </tr>
                                        </tfoot>
                                    )}
                                </table>
                            </div>
                        </div>
                    )}

                    {subVista === 'empleado' && (
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                                <div className="flex items-center gap-4 w-full md:w-auto">
                                    <Icon name="users" className="w-8 h-8 text-brand-primary" />
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Seleccionar Empleado</label>
                                        <select value={filtroEmp} onChange={e => setFiltroEmp(e.target.value)} className="w-full md:w-64 rounded-lg border-slate-300 border p-2.5 bg-slate-50 focus:ring-2 focus:ring-brand-primary font-semibold outline-none">
                                            <option value="">Elegir empleado...</option>
                                            {empleados.map(e => <option key={e.id} value={e.id}>{e.nombre}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            {!filtroEmp ? (
                                <div className="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                                    <p className="text-lg font-medium">Seleccioná un empleado para ver su análisis histórico.</p>
                                </div>
                            ) : datosEmpleado && (
                                <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                    <div className="lg:col-span-1 space-y-4">
                                        <div className="bg-brand-primary text-white rounded-xl p-5 shadow-lg">
                                            <p className="text-xs font-bold text-pink-200 uppercase mb-1">Total Pagado Histórico</p>
                                            <h3 className="text-2xl font-black">{formatCurrency(datosEmpleado.totales.neto)}</h3>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
                                            <p className="text-xs font-bold text-emerald-700 uppercase mb-1">Promedio Mensual Neto</p>
                                            <h3 className="text-xl font-black text-emerald-900">{formatCurrency(datosEmpleado.promedio)}</h3>
                                        </div>
                                        <div className="bg-red-50 border border-red-200 rounded-xl p-5 shadow-sm">
                                            <p className="text-xs font-bold text-red-700 uppercase mb-1">Total Deducciones Hist.</p>
                                            <h3 className="text-xl font-black text-red-900">{formatCurrency(datosEmpleado.totales.deducciones)}</h3>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase text-xs">
                                                <tr>
                                                    <th className="py-3 px-4 font-bold">Período</th>
                                                    <th className="py-3 px-4 font-bold">Tipo</th>
                                                    <th className="py-3 px-4 font-bold text-center">Horas</th>
                                                    <th className="py-3 px-4 font-bold text-right text-emerald-700">Haberes</th>
                                                    <th className="py-3 px-4 font-bold text-right text-red-700">Descuentos</th>
                                                    <th className="py-3 px-4 font-bold text-right text-brand-primary">Neto</th>
                                                    <th className="py-3 px-4 font-bold text-left">Observaciones</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {datosEmpleado.recibos.map(r => {
                                                    const empSeleccionado = empleados.find(e => e.id === r.empleado.id);
                                                    const base = empSeleccionado ? (empSeleccionado.horasBase || 190) : 190;
                                                    const targetHs = r.tipoLiquidacion === 'Mensual' ? base : (r.tipoLiquidacion.includes('Quincena') ? base / 2 : 0);
                                                    const difLocal = r.isPremio ? 0 : (r.totalHoras || 0) - targetHs;

                                                    return (
                                                        <tr key={r.idGuardado} className="hover:bg-slate-50">
                                                            <td className="py-3 px-4 font-bold text-slate-800">{r.periodo}</td>
                                                            <td className="py-3 px-4 text-xs font-semibold text-slate-500"><span className={`bg-slate-200 px-2 py-0.5 rounded ${r.isPremio ? 'bg-amber-100 text-amber-700' : ''}`}>{r.isPremio ? 'PREMIOS' : r.tipoLiquidacion}</span></td>
                                                            <td className="py-3 px-4 text-center">
                                                                {!r.isPremio ? (
                                                                    <>
                                                                        <div className="font-bold text-slate-700 leading-none">{r.totalHoras}h</div>
                                                                        {difLocal > 0 && <div className="text-[10px] text-emerald-600 font-bold bg-emerald-100 rounded px-1 mt-1 inline-block">+{difLocal}h</div>}
                                                                        {difLocal < 0 && <div className="text-[10px] text-red-600 font-bold bg-red-100 rounded px-1 mt-1 inline-block">{difLocal}h</div>}
                                                                    </>
                                                                ) : <span className="text-slate-400">-</span>}
                                                            </td>
                                                            <td className="py-3 px-4 text-right font-medium text-emerald-600">{formatCurrency(r.totalHaberes)}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-red-600">{formatCurrency(r.totalDeducciones)}</td>
                                                            <td className="py-3 px-4 text-right font-black text-brand-primary">{formatCurrency(r.neto)}</td>
                                                            <td className="py-3 px-4">
                                                                <input 
                                                                    type="text"
                                                                    value={r.observacion || ''}
                                                                    onChange={(e) => handleUpdateNota(r.idGuardado, e.target.value)}
                                                                    placeholder={difLocal > 0 ? 'Horas extras...' : (difLocal < 0 ? 'Ausentismo...' : 'Añadir nota...')}
                                                                    className="w-full text-xs p-1.5 border border-transparent hover:border-slate-300 focus:border-brand-primary bg-slate-100 focus:bg-white rounded outline-none transition-colors"
                                                                />
                                                            </td>
                                                        </tr>
                                                    )
                                                })}
                                                {datosEmpleado.recibos.length === 0 && (
                                                    <tr><td colSpan="7" className="py-8 text-center text-slate-500">No hay recibos para este empleado.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {subVista === 'historial' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                    <div className="bg-pink-100 p-3 rounded-lg"><Icon name="file-text" className="w-6 h-6 text-brand-primary"/></div>
                                    <div><p className="text-xs font-bold text-slate-500 uppercase">Total Recibos</p><p className="text-xl font-black text-slate-800">{historialFiltrado.length}</p></div>
                                </div>
                                <div className="bg-white p-5 rounded-xl border border-emerald-200 shadow-sm flex items-center gap-4">
                                    <div className="bg-emerald-100 p-3 rounded-lg"><Icon name="calculator" className="w-6 h-6 text-emerald-600"/></div>
                                    <div><p className="text-xs font-bold text-emerald-700 uppercase">Total Haberes</p><p className="text-lg font-black text-emerald-900">{formatCurrency(statsHistorial.totalHaberes)}</p></div>
                                </div>
                                <div className="bg-white p-5 rounded-xl border border-red-200 shadow-sm flex items-center gap-4">
                                    <div className="bg-red-100 p-3 rounded-lg"><Icon name="alert-triangle" className="w-6 h-6 text-red-600"/></div>
                                    <div><p className="text-xs font-bold text-red-700 uppercase">Total Deducciones</p><p className="text-lg font-black text-red-900">{formatCurrency(statsHistorial.totalDeducciones)}</p></div>
                                </div>
                                <div className="bg-pink-50 p-5 rounded-xl border border-pink-200 shadow-sm flex items-center gap-4">
                                    <div className="bg-brand-primary p-3 rounded-lg"><Icon name="bar-chart" className="w-6 h-6 text-white"/></div>
                                    <div><p className="text-xs font-bold text-brand-primary uppercase">Neto Total</p><p className="text-lg font-black text-slate-900">{formatCurrency(statsHistorial.totalNeto)}</p></div>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                                <div className="p-4 border-b border-slate-200 bg-slate-50 flex flex-wrap gap-4 justify-between items-center">
                                    <div className="flex gap-4 items-center">
                                        <select value={filtroMes} onChange={e => setFiltroMes(e.target.value)} className="rounded-lg border-slate-300 border p-2 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 outline-none">
                                            <option value="">Todos los meses</option>
                                            {periodosDisponibles.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    <div className="relative">
                                        <input type="text" placeholder="Buscar por empleado..." value={busqueda} onChange={e => setBusqueda(e.target.value)} className="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm w-64 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        <div className="absolute left-3 top-2.5 text-slate-400"><Icon name="users" className="w-4 h-4" /></div>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase text-xs">
                                            <tr>
                                                <th className="py-3 px-4 font-semibold">Ref</th>
                                                <th className="py-3 px-4 font-semibold">Período</th>
                                                <th className="py-3 px-4 font-semibold">Empleado</th>
                                                <th className="py-3 px-4 font-semibold text-center">Tipo</th>
                                                <th className="py-3 px-4 font-semibold text-right text-emerald-700">Haberes</th>
                                                <th className="py-3 px-4 font-semibold text-right text-red-700">Deducciones</th>
                                                <th className="py-3 px-4 font-bold text-right text-slate-800">Neto</th>
                                                <th className="py-3 px-4 font-semibold text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {historialFiltrado.length === 0 ? (
                                                <tr><td colSpan="8" className="py-8 text-center text-slate-500">No se encontraron recibos.</td></tr>
                                            ) : (
                                                historialFiltrado.map((liq) => (
                                                    <tr key={liq.idGuardado} className="hover:bg-slate-50 group">
                                                        <td className="py-3 px-4 text-xs font-mono text-slate-400">#{String(liq.idGuardado).slice(-4)}</td>
                                                        <td className="py-3 px-4 font-bold text-slate-700">{liq.periodo}</td>
                                                        <td className="py-3 px-4 font-medium text-slate-800">{liq.empleado.nombre}</td>
                                                        <td className="py-3 px-4 text-center"><span className={`text-[10px] font-black px-2 py-0.5 rounded ${liq.isPremio ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>{liq.isPremio ? 'PREMIOS' : (liq.tipoLiquidacion ? liq.tipoLiquidacion.toUpperCase() : '')}</span></td>
                                                        <td className="py-3 px-4 text-right font-medium text-emerald-600">{formatCurrency(liq.totalHaberes)}</td>
                                                        <td className="py-3 px-4 text-right font-medium text-red-500">{formatCurrency(liq.totalDeducciones)}</td>
                                                        <td className="py-3 px-4 text-right font-black text-slate-900">{formatCurrency(liq.neto)}</td>
                                                        <td className="py-3 px-4 text-center">
                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => handleEdit(liq)} className="p-1.5 text-brand-primary hover:bg-pink-100 rounded-lg transition-colors" title="Editar (Cargar en Liquidador)"><Icon name="edit" className="w-5 h-5"/></button>
                                                                <button onClick={() => handleDelete(liq.idGuardado)} className="p-1.5 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Eliminar Permanentemente"><Icon name="trash" className="w-5 h-5"/></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SeccionAsistencias = ({ empleados, onGuardarJornada, onEliminarFichaje, showToast }) => {
            const hoyAR = Datos.partesAR().fecha;
            const [desde, setDesde] = useState(hoyAR.slice(0, 8) + '01');
            const [hasta, setHasta] = useState(hoyAR);
            const [filtroEmp, setFiltroEmp] = useState('');
            const [vista, setVista] = useState('jornadas');
            const [edicion, setEdicion] = useState(null); // jornada que se está cargando o corrigiendo
            const [errorEdicion, setErrorEdicion] = useState('');
            const [guardandoJornada, setGuardandoJornada] = useState(false);
            const [, setTick] = useState(0);
            const [fichajes, setFichajes] = useState([]);
            const [cargando, setCargando] = useState(true);

            // Escucha en vivo el rango filtrado y además las últimas 24 hs (para "Presentes ahora")
            useEffect(() => {
                if (!desde || !hasta) return;
                setCargando(true);
                const rango = Datos.rangoEnMs(desde, hasta);
                const ayer = Datos.ahora() - 86400000;
                return Datos.escucharFichajes(
                    { desde: Math.min(rango.desde - 86400000, ayer), hasta: Math.max(rango.hasta, Datos.ahora() + 3600000) },
                    (lista) => { setFichajes(lista); setCargando(false); },
                    (err) => { showToast('Error al leer asistencias: ' + Datos.errorAmigable(err), 'error'); setCargando(false); }
                );
            }, [desde, hasta]);

            // Refresca "presentes ahora" y jornadas en curso cada minuto
            useEffect(() => {
                const t = setInterval(() => setTick(x => x + 1), 60000);
                return () => clearInterval(t);
            }, []);

            const fichajesFiltrados = useMemo(() => fichajes.filter(f =>
                f.fecha >= desde && f.fecha <= hasta && (!filtroEmp || f.empleadoId === parseInt(filtroEmp))
            ), [fichajes, desde, hasta, filtroEmp]);

            const jornadas = useMemo(() => Datos.calcularJornadas(fichajesFiltrados), [fichajesFiltrados]);

            const resumenPorEmpleado = useMemo(() => {
                const res = {};
                jornadas.forEach(j => {
                    const r = res[j.empleadoId] = res[j.empleadoId] || { nombre: j.empleadoNombre, horas: 0, dias: new Set(), incompletas: 0 };
                    if (j.completa) { r.horas += j.horas; r.dias.add(j.fecha); }
                    else if (!j.enCurso) r.incompletas++;
                });
                return Object.entries(res).map(([id, r]) => {
                    const emp = empleados.find(e => e.id === parseInt(id));
                    return { id, ...r, nombre: emp ? emp.nombre : r.nombre, dias: r.dias.size, horasBase: emp ? (emp.horasBase || 190) : 190 };
                }).sort((a, b) => b.horas - a.horas);
            }, [jornadas, empleados]);

            const presentes = empleados
                .filter(e => Datos.estaPresente(e.id, fichajes))
                .map(e => ({ ...e, desde: Datos.ultimoFichaje(e.id, fichajes) }));

            const fichajesHoy = fichajes.filter(f => f.fecha === hoyAR).length;
            const totalIncompletas = jornadas.filter(j => !j.completa && !j.enCurso).length;

            const nombreEmpleado = (id, respaldo) => {
                const emp = empleados.find(e => e.id === id);
                return emp ? emp.nombre : (respaldo || 'Empleado eliminado');
            };

            // Tiempo transcurrido desde una marca (con la hora guardada en Firebase)
            const tiempoDesde = (fichaje) => Datos.formatearHoras(Math.max(0, Datos.ahora() - fichaje.timestamp) / 3600000);

            // Cargar una jornada nueva (por ejemplo, si no se pudo fichar por un corte de internet)
            const nuevaJornada = () => {
                setErrorEdicion('');
                setEdicion({ nueva: true, empleadoId: filtroEmp || '', entrada: null, salida: null, entradaFecha: hoyAR, entradaHora: '', salidaFecha: hoyAR, salidaHora: '', nota: '' });
            };

            // Corregir una jornada existente (completar la salida, ajustar horarios, etc.)
            const editarJornada = (j) => {
                setErrorEdicion('');
                const fechaBase = (j.entrada || j.salida).fecha;
                setEdicion({
                    nueva: false, empleadoId: String(j.empleadoId), empleadoNombre: j.empleadoNombre,
                    entrada: j.entrada, salida: j.salida,
                    entradaFecha: j.entrada ? j.entrada.fecha : fechaBase, entradaHora: j.entrada ? j.entrada.hora.slice(0, 5) : '',
                    salidaFecha: j.salida ? j.salida.fecha : fechaBase, salidaHora: j.salida ? j.salida.hora.slice(0, 5) : '',
                    nota: ''
                });
            };

            // Si no se tocó la fecha ni la hora, se conserva la marca original (con sus segundos)
            const marcaDe = (fecha, hora, original) =>
                original && original.fecha === fecha && original.hora.slice(0, 5) === hora ? original.timestamp : Datos.timestampDesdeAR(fecha, hora);

            const guardarEdicion = async (e) => {
                e.preventDefault();
                const ed = edicion;
                const entradaTs = marcaDe(ed.entradaFecha, ed.entradaHora, ed.entrada);
                const salidaTs = ed.salidaHora ? marcaDe(ed.salidaFecha, ed.salidaHora, ed.salida) : null;
                const limite = Datos.ahora() + 5 * 60000;
                if (entradaTs > limite || (salidaTs && salidaTs > limite)) return setErrorEdicion('No se pueden cargar horarios en el futuro.');
                if (salidaTs && salidaTs <= entradaTs) return setErrorEdicion('La salida tiene que ser posterior a la entrada. Si salió después de medianoche, cambiá la fecha de salida.');
                if (salidaTs && salidaTs - entradaTs >= Datos.JORNADA_MAX_MS) return setErrorEdicion('Una jornada no puede superar las 16 horas. Revisá las fechas.');
                const empleadoId = parseInt(ed.empleadoId);
                setGuardandoJornada(true);
                const ok = await onGuardarJornada({
                    empleadoId,
                    empleadoNombre: nombreEmpleado(empleadoId, ed.empleadoNombre),
                    entrada: ed.entrada, salida: ed.salida,
                    entradaTs, salidaTs, nota: ed.nota.trim()
                });
                setGuardandoJornada(false);
                if (ok) setEdicion(null);
            };

            const exportarCSV = () => {
                const filas = [['Fecha', 'Empleado', 'Entrada', 'Salida', 'Horas', 'Estado']];
                [...jornadas].reverse().forEach(j => filas.push([
                    Datos.fechaCorta(j.fecha),
                    nombreEmpleado(j.empleadoId, j.empleadoNombre),
                    j.entrada ? j.entrada.hora : '',
                    j.salida ? j.salida.hora : '',
                    j.completa ? j.horas.toFixed(2).replace('.', ',') : '',
                    j.completa ? 'Completa' : (j.enCurso ? 'En curso' : (j.entrada ? 'Falta salida' : 'Falta entrada'))
                ]));
                const csv = '﻿' + filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                link.download = `asistencias_${desde}_a_${hasta}.csv`;
                link.click();
                showToast('Planilla de asistencias descargada.', 'success');
            };

            // (M) = cargada a mano · (E) = corregida (el cartelito muestra la hora original)
            const textoOriginal = (f) => {
                if (!f.timestampOriginal) return 'Corregida desde el sistema interno';
                const o = Datos.partesAR(new Date(f.timestampOriginal));
                return `Corregida. Hora original: ${Datos.fechaCorta(o.fecha)} ${o.hora.slice(0, 5)}`;
            };
            // ⚠ = el empleado la registró en el Módulo de Asistencias aceptando una advertencia (marca repetida, entrada sin salida, etc.)
            const marcaOrigen = (f) => (
                <>
                    {f.editado
                        ? <span title={textoOriginal(f)} className="ml-1 text-[9px] text-amber-600 font-bold cursor-help">(E)</span>
                        : (f.origen === 'manual' ? <span title="Cargada a mano" className="ml-1 text-[9px] text-slate-400">(M)</span> : null)}
                    {f.origen === 'kiosco' && (f.nota || '').startsWith('Con advertencia') && (
                        <span title={f.nota} className="ml-1 text-[11px] text-amber-600 font-black cursor-help">⚠</span>
                    )}
                </>
            );

            const badgeTipo = (tipo) => tipo === 'entrada'
                ? <span className="bg-emerald-100 text-emerald-700 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">Entrada</span>
                : <span className="bg-slate-200 text-slate-700 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">Salida</span>;

            return (
                <div className="p-8 space-y-6 max-w-6xl mx-auto">
                    <div className="flex flex-wrap gap-4 justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3">
                            <Icon name="clock" className="text-brand-primary w-8 h-8"/>
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Control de Asistencias</h2>
                                <p className="text-slate-500 text-sm mt-1">Fichajes registrados desde el Módulo de Asistencias (horario de Argentina).</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <a href="asistencias.html" target="_blank" rel="noopener" className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2.5 rounded-lg font-bold hover:bg-slate-700 transition-colors shadow text-sm">
                                <Icon name="external" className="w-4 h-4"/> Abrir Módulo
                            </a>
                            <button onClick={nuevaJornada} className="bg-brand-primary text-white px-4 py-2.5 rounded-lg font-bold hover:bg-opacity-90 transition-colors shadow text-sm">
                                + Cargar Jornada
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 border-t-4 border-t-brand-primary">
                            <p className="text-xs font-bold text-brand-primary uppercase tracking-widest mb-3">Presentes ahora ({presentes.length})</p>
                            {presentes.length === 0 ? (
                                <p className="text-sm text-slate-500">Nadie fichó entrada todavía.</p>
                            ) : (
                                <ul className="space-y-1.5 max-h-32 overflow-y-auto pr-1">
                                    {presentes.map(p => (
                                        <li key={p.id} className="flex justify-between text-sm">
                                            <span className="font-semibold text-slate-800 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-emerald-500"></span>{p.nombre}</span>
                                            <span className="text-slate-500 font-mono">desde {p.desde.hora.slice(0, 5)} · <span className="text-emerald-600 font-bold">{tiempoDesde(p.desde)}</span></span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Fichajes de hoy</p>
                            <p className="text-4xl font-black text-slate-800">{fichajesHoy}</p>
                            <p className="text-xs text-slate-400 mt-1">{Datos.fechaLarga()}</p>
                        </div>
                        <div className={`rounded-2xl p-5 shadow-sm border ${totalIncompletas ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}`}>
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Jornadas incompletas</p>
                            <p className={`text-4xl font-black ${totalIncompletas ? 'text-amber-600' : 'text-slate-800'}`}>{totalIncompletas}</p>
                            <p className="text-xs text-slate-400 mt-1">En el rango filtrado. Corregilas con el botón Editar de cada jornada.</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200">
                        <div className="flex flex-wrap gap-4 items-end justify-between p-5 border-b border-slate-200">
                            <div className="flex flex-wrap gap-4 items-end">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Desde</label>
                                    <input type="date" value={desde} onChange={e => setDesde(e.target.value)} className="rounded-lg border-slate-300 border p-2 bg-slate-50 font-semibold text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Hasta</label>
                                    <input type="date" value={hasta} onChange={e => setHasta(e.target.value)} className="rounded-lg border-slate-300 border p-2 bg-slate-50 font-semibold text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Empleado</label>
                                    <select value={filtroEmp} onChange={e => setFiltroEmp(e.target.value)} className="rounded-lg border-slate-300 border p-2 bg-slate-50 font-semibold text-sm">
                                        <option value="">Todos</option>
                                        {empleados.map(emp => <option key={emp.id} value={emp.id}>{emp.nombre}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <div className="flex bg-slate-100 rounded-lg p-1">
                                    {[['jornadas', 'Jornadas'], ['resumen', 'Resumen'], ['registros', 'Registros']].map(([id, label]) => (
                                        <button key={id} onClick={() => setVista(id)} className={`px-3 py-1.5 text-sm font-bold rounded-md transition-colors ${vista === id ? 'bg-white text-brand-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
                                    ))}
                                </div>
                                <button onClick={exportarCSV} className="flex items-center gap-1.5 text-sm font-bold bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg hover:bg-emerald-200 transition-colors">
                                    <Icon name="download" className="w-4 h-4"/> CSV
                                </button>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            {vista === 'jornadas' && (
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 border-b border-slate-200 uppercase text-xs text-slate-500">
                                        <tr>
                                            <th className="py-3 px-5 font-semibold">Fecha</th>
                                            <th className="py-3 px-5 font-semibold">Empleado</th>
                                            <th className="py-3 px-5 font-semibold text-center">Entrada</th>
                                            <th className="py-3 px-5 font-semibold text-center">Salida</th>
                                            <th className="py-3 px-5 font-semibold text-right">Horas</th>
                                            <th className="py-3 px-5 font-semibold text-center">Estado</th>
                                            <th className="py-3 px-5 font-semibold text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {jornadas.map((j, idx) => (
                                            <tr key={idx} className={`hover:bg-slate-50 ${!j.completa && !j.enCurso ? 'bg-amber-50/50' : ''}`}>
                                                <td className="py-3 px-5 font-semibold text-slate-600">{Datos.fechaCorta(j.fecha)}</td>
                                                <td className="py-3 px-5 font-bold text-slate-800">{nombreEmpleado(j.empleadoId, j.empleadoNombre)}</td>
                                                <td className="py-3 px-5 text-center font-mono">{j.entrada ? j.entrada.hora.slice(0, 5) : '—'}{j.entrada && marcaOrigen(j.entrada)}</td>
                                                <td className="py-3 px-5 text-center font-mono">
                                                    {j.salida ? j.salida.hora.slice(0, 5) : '—'}{j.salida && marcaOrigen(j.salida)}
                                                    {j.salida && j.entrada && j.salida.fecha !== j.entrada.fecha && <span className="ml-1 text-[9px] text-slate-400">(+1 día)</span>}
                                                </td>
                                                <td className="py-3 px-5 text-right font-black text-brand-primary">
                                                    {j.completa ? Datos.formatearHoras(j.horas) : (j.enCurso ? <span className="text-blue-600" title="Tiempo trabajado hasta ahora">{tiempoDesde(j.entrada)}</span> : '')}
                                                </td>
                                                <td className="py-3 px-5 text-center">
                                                    {j.completa && <span className="bg-emerald-100 text-emerald-700 text-[10px] font-black px-2 py-0.5 rounded-full">COMPLETA</span>}
                                                    {!j.completa && j.enCurso && <span className="bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-0.5 rounded-full">EN CURSO</span>}
                                                    {!j.completa && !j.enCurso && <span className="bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded-full">{j.entrada ? 'FALTA SALIDA' : 'FALTA ENTRADA'}</span>}
                                                </td>
                                                <td className="py-3 px-5 text-center">
                                                    <button onClick={() => editarJornada(j)} className="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold text-brand-primary hover:bg-pink-50 rounded-lg transition-colors" title="Corregir horarios">
                                                        <Icon name="edit" className="w-4 h-4"/> Editar
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {jornadas.length === 0 && (
                                            <tr><td colSpan="7"className="py-10 text-center text-slate-400 font-medium">{cargando ? 'Cargando...' : 'No hay fichajes en el rango seleccionado.'}</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            )}

                            {vista === 'resumen' && (
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 border-b border-slate-200 uppercase text-xs text-slate-500">
                                        <tr>
                                            <th className="py-3 px-5 font-semibold">Empleado</th>
                                            <th className="py-3 px-5 font-semibold text-center">Días trabajados</th>
                                            <th className="py-3 px-5 font-semibold text-right">Horas totales</th>
                                            <th className="py-3 px-5 font-semibold text-right">Horas base (mes)</th>
                                            <th className="py-3 px-5 font-semibold text-center">Incompletas</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {resumenPorEmpleado.map(r => (
                                            <tr key={r.id} className="hover:bg-slate-50">
                                                <td className="py-3 px-5 font-bold text-slate-800">{r.nombre}</td>
                                                <td className="py-3 px-5 text-center font-semibold">{r.dias}</td>
                                                <td className="py-3 px-5 text-right font-black text-brand-primary">{r.horas.toFixed(2)} hs <span className="text-slate-400 font-medium text-xs">({Datos.formatearHoras(r.horas)})</span></td>
                                                <td className="py-3 px-5 text-right text-slate-500">{r.horasBase} hs</td>
                                                <td className="py-3 px-5 text-center">{r.incompletas > 0 ? <span className="text-amber-600 font-black">{r.incompletas}</span> : <span className="text-slate-300">0</span>}</td>
                                            </tr>
                                        ))}
                                        {resumenPorEmpleado.length === 0 && (
                                            <tr><td colSpan="5" className="py-10 text-center text-slate-400 font-medium">{cargando ? 'Cargando...' : 'No hay fichajes en el rango seleccionado.'}</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            )}

                            {vista === 'registros' && (
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 border-b border-slate-200 uppercase text-xs text-slate-500">
                                        <tr>
                                            <th className="py-3 px-5 font-semibold">Fecha y hora</th>
                                            <th className="py-3 px-5 font-semibold">Empleado</th>
                                            <th className="py-3 px-5 font-semibold text-center">Tipo</th>
                                            <th className="py-3 px-5 font-semibold">Origen / Nota</th>
                                            <th className="py-3 px-5 font-semibold text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {[...fichajesFiltrados].sort((a, b) => b.timestamp - a.timestamp).map(f => (
                                            <tr key={f.id} className="hover:bg-slate-50 group">
                                                <td className="py-3 px-5 font-mono text-slate-700">{Datos.fechaCorta(f.fecha)} {f.hora}{marcaOrigen(f)}</td>
                                                <td className="py-3 px-5 font-bold text-slate-800">{nombreEmpleado(f.empleadoId, f.empleadoNombre)}</td>
                                                <td className="py-3 px-5 text-center">{badgeTipo(f.tipo)}</td>
                                                <td className="py-3 px-5 text-slate-500 text-xs">{f.origen === 'manual' ? 'Carga manual' : 'Módulo de asistencias'}{f.editado ? ' · corregida' : ''}{f.nota ? ` · ${f.nota}` : ''}</td>
                                                <td className="py-3 px-5 text-center">
                                                    <button onClick={() => onEliminarFichaje(f)} className="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors opacity-0 group-hover:opacity-100" title="Eliminar">
                                                        <Icon name="trash" className="w-4 h-4"/>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {fichajesFiltrados.length === 0 && (
                                            <tr><td colSpan="5" className="py-10 text-center text-slate-400 font-medium">{cargando ? 'Cargando...' : 'No hay fichajes en el rango seleccionado.'}</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>

                    {edicion && (() => {
                        const ed = edicion;
                        const cambiar = (campo) => (e) => { setErrorEdicion(''); setEdicion({ ...ed, [campo]: e.target.value }); };
                        const campo = "w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-brand-primary outline-none";
                        // Vista previa de las horas trabajadas con lo cargado
                        let previa = '';
                        if (ed.entradaHora && ed.salidaHora) {
                            const h = (marcaDe(ed.salidaFecha, ed.salidaHora, ed.salida) - marcaDe(ed.entradaFecha, ed.entradaHora, ed.entrada)) / 3600000;
                            previa = h > 0 ? Datos.formatearHoras(h) : '';
                        }
                        return (
                            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                                <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl">
