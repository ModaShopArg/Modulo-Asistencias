                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="text-xl font-bold">{ed.nueva ? 'Cargar Jornada' : 'Editar Jornada'}</h3>
                                        <button onClick={() => setEdicion(null)} className="text-slate-400 hover:text-black"><Icon name="x"/></button>
                                    </div>
                                    <p className="text-sm text-slate-500 mb-5">
                                        {ed.nueva
                                            ? 'Para cuando no se pudo fichar (corte de internet, falla del equipo u olvido). Si todavía está trabajando, dejá la salida vacía.'
                                            : 'Corregí los horarios reales. La hora original queda registrada.'} Horario de Argentina.
                                    </p>
                                    <form onSubmit={guardarEdicion} className="space-y-4">
                                        {ed.nueva ? (
                                            <select required value={ed.empleadoId} onChange={cambiar('empleadoId')} className={campo}>
                                                <option value="">Seleccione un empleado...</option>
                                                {empleados.map(emp => <option key={emp.id} value={emp.id}>{emp.nombre}</option>)}
                                            </select>
                                        ) : (
                                            <p className="font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg p-3">{nombreEmpleado(parseInt(ed.empleadoId), ed.empleadoNombre)}</p>
                                        )}
                                        <div>
                                            <label className="block text-xs font-bold text-emerald-700 uppercase mb-1">Entrada</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <input required type="date" value={ed.entradaFecha} onChange={cambiar('entradaFecha')} className={campo} />
                                                <input required type="time" value={ed.entradaHora} onChange={cambiar('entradaHora')} className={campo} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-brand-primary uppercase mb-1">Salida {!ed.salida && <span className="text-slate-400 normal-case font-semibold">(vacía si sigue trabajando)</span>}</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <input required={!!ed.salida || !!ed.salidaHora} type="date" value={ed.salidaFecha} onChange={cambiar('salidaFecha')} className={campo} />
                                                <input required={!!ed.salida} type="time" value={ed.salidaHora} onChange={cambiar('salidaHora')} className={campo} />
                                            </div>
                                        </div>
                                        {previa && <p className="text-sm text-slate-600">Horas trabajadas: <span className="font-black text-brand-primary">{previa}</span></p>}
                                        <input type="text" placeholder="Motivo (opcional): ej. corte de internet" value={ed.nota} onChange={cambiar('nota')} className={campo} />
                                        {errorEdicion && <p className="text-sm font-bold text-red-600 bg-red-50 border border-red-200 rounded-lg p-3">{errorEdicion}</p>}
                                        <button type="submit" disabled={guardandoJornada} className="w-full bg-brand-primary text-white font-bold py-3 rounded-lg hover:bg-opacity-90 mt-2 shadow disabled:opacity-60">
                                            {guardandoJornada ? 'Guardando...' : 'Guardar Jornada'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        // Frases que el Módulo de Asistencias muestra al fichar la entrada y la salida
        const FrasesMotivadoras = ({ showToast }) => {
            const [frases, setFrases] = useState(null);
            const [nuevas, setNuevas] = useState({ entrada: '', salida: '' });
            const [errorLectura, setErrorLectura] = useState('');
            const [confirmarRestaurar, setConfirmarRestaurar] = useState(false);

            useEffect(() => Datos.escucharFrases(
                f => { setFrases(f); setErrorLectura(''); },
                err => setErrorLectura(err.code === 'permission-denied'
                    ? 'Para usar esta sección, publicá en Firebase las reglas actualizadas del archivo firestore.rules (Firestore Database → Reglas).'
                    : Datos.errorAmigable(err))
            ), []);

            const guardar = async (cambios, mensaje) => {
                try {
                    await Datos.guardarFrases({ entrada: frases.entrada, salida: frases.salida, ...cambios });
                    showToast(mensaje);
                } catch (err) {
                    showToast('No se pudieron guardar las frases: ' + Datos.errorAmigable(err), 'error');
                }
            };

            const agregar = (tipo) => (e) => {
                e.preventDefault();
                const texto = nuevas[tipo].trim();
                if (!texto) return;
                guardar({ [tipo]: [...frases[tipo], texto] }, 'Frase agregada.');
                setNuevas({ ...nuevas, [tipo]: '' });
            };

            const quitar = (tipo, indice) => guardar({ [tipo]: frases[tipo].filter((_, i) => i !== indice) }, 'Frase eliminada.');

            const restaurar = async () => {
                setConfirmarRestaurar(false);
                try {
                    await Datos.restaurarFrases();
                    showToast('Se restauraron las frases predeterminadas.');
                } catch (err) {
                    showToast('No se pudieron restaurar: ' + Datos.errorAmigable(err), 'error');
                }
            };

            const columnas = [
                { tipo: 'entrada', titulo: 'Al fichar la entrada', color: 'text-emerald-700', borde: 'border-emerald-200', fondo: 'bg-emerald-50', boton: 'bg-emerald-600 hover:bg-emerald-700', ejemplo: 'Ej: ¡Arrancamos con todo, {nombre}!' },
                { tipo: 'salida', titulo: 'Al fichar la salida', color: 'text-brand-primary', borde: 'border-pink-200', fondo: 'bg-pink-50', boton: 'bg-brand-primary hover:bg-opacity-90', ejemplo: 'Ej: ¡Gracias por tu esfuerzo, {nombre}!' }
            ];

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 mt-8">
                    <div className="flex flex-wrap justify-between items-start gap-4 mb-2">
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="award" className="text-brand-primary"/> Frases Motivadoras
                        </h2>
                        {frases && frases.personalizadas && (
                            confirmarRestaurar ? (
                                <div className="flex items-center gap-2 text-sm">
                                    <span className="text-slate-500 font-semibold">¿Reemplazar todas por las predeterminadas?</span>
                                    <button onClick={restaurar} className="px-3 py-1.5 rounded-lg bg-red-600 text-white font-bold">Sí</button>
                                    <button onClick={() => setConfirmarRestaurar(false)} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-bold">No</button>
                                </div>
                            ) : (
                                <button onClick={() => setConfirmarRestaurar(true)} className="text-sm font-bold text-slate-500 hover:text-brand-primary">Restaurar predeterminadas</button>
                            )
                        )}
                    </div>
                    <p className="text-slate-500 mb-6">
                        El Módulo de Asistencias muestra una al azar, bien destacada, cada vez que alguien ficha.
                        Escribí <code className="bg-slate-100 text-brand-primary font-bold px-1.5 py-0.5 rounded">{'{nombre}'}</code> para incluir el nombre del empleado.
                        {frases && !frases.personalizadas && ' Por ahora se usan las frases predeterminadas: al agregar o quitar una, pasan a ser tuyas.'}
                    </p>

                    {errorLectura && <p className="mb-6 text-sm font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-4">{errorLectura}</p>}

                    {frases && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {columnas.map(c => (
                                <div key={c.tipo} className={`rounded-xl border ${c.borde} ${c.fondo} p-5 flex flex-col`}>
                                    <h3 className={`font-black uppercase tracking-wider text-sm mb-3 ${c.color}`}>{c.titulo} ({frases[c.tipo].length})</h3>
                                    <ul className="space-y-2 mb-4 flex-1">
                                        {frases[c.tipo].map((f, i) => (
                                            <li key={i} className="group bg-white rounded-lg border border-slate-200 px-3 py-2 flex items-start gap-2 text-sm text-slate-700">
                                                <span className="flex-1">“{f}”</span>
                                                <button onClick={() => quitar(c.tipo, i)} className="p-1 text-red-600 hover:bg-red-50 rounded opacity-40 group-hover:opacity-100 transition-opacity" title="Eliminar frase">
                                                    <Icon name="trash" className="w-4 h-4"/>
                                                </button>
                                            </li>
                                        ))}
                                        {frases[c.tipo].length === 0 && <li className="text-sm text-slate-500 italic">Sin frases: al fichar no se muestra ninguna.</li>}
                                    </ul>
                                    <form onSubmit={agregar(c.tipo)} className="flex gap-2">
                                        <input value={nuevas[c.tipo]} onChange={e => setNuevas({ ...nuevas, [c.tipo]: e.target.value })} maxLength={160} placeholder={c.ejemplo}
                                            className="flex-1 min-w-0 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-brand-primary" />
                                        <button type="submit" className={`px-4 py-2 rounded-lg text-white font-bold text-sm transition-colors ${c.boton}`}>Agregar</button>
                                    </form>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const Configuracion = ({ empleados, historial, showToast }) => {
            const handleExport = async () => {
                let fichajes;
                try {
                    fichajes = (await Datos.obtenerFichajes()).map(({ pendiente, ...f }) => f);
                } catch (err) {
                    showToast('No se pudieron leer las asistencias: ' + Datos.errorAmigable(err), 'error');
                    return;
                }
                const dataStr = JSON.stringify({ empleados, historial, fichajes });
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `modashop_datos_${new Date().toISOString().split('T')[0]}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                showToast("Datos descargados correctamente.", "success");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    let importedData;
                    try {
                        importedData = JSON.parse(event.target.result);
                    } catch (error) {
                        showToast("Error: El archivo no tiene el formato correcto.", "error");
                        return;
                    }
                    try {
                        showToast("Subiendo datos a la nube...", "success");
                        const total = await Datos.importarRespaldo(importedData);
                        showToast(`Datos cargados correctamente (${total} registros). ¡Tablero actualizado!`, "success");
                    } catch (error) {
                        showToast("Error al subir el respaldo: " + Datos.errorAmigable(error), "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="p-8 max-w-4xl mx-auto">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h2 className="text-2xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                            <Icon name="settings" className="text-brand-primary"/> Compartir y Respaldar Tablero
                        </h2>
                        <p className="text-slate-500 mb-8">Utilizá estas opciones para hacer copias de seguridad de tus datos localmente.</p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="border-2 border-dashed border-emerald-200 bg-emerald-50 rounded-xl p-6 text-center">
                                <Icon name="download" className="w-12 h-12 text-emerald-500 mx-auto mb-4" />
                                <h3 className="font-bold text-emerald-800 mb-2">1. Exportar (Descargar)</h3>
                                <p className="text-xs text-emerald-600 mb-4">Descargá un archivo con todos los datos actuales para hacer un backup.</p>
                                <button onClick={handleExport} className="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700 transition-colors">
                                    Descargar Archivo .json
                                </button>
                            </div>

                            <div className="border-2 border-dashed border-blue-200 bg-blue-50 rounded-xl p-6 text-center">
                                <Icon name="upload" className="w-12 h-12 text-blue-500 mx-auto mb-4" />
                                <h3 className="font-bold text-blue-800 mb-2">2. Importar (Cargar)</h3>
                                <p className="text-xs text-blue-600 mb-4">Restaurá un archivo de backup previamente guardado.</p>
                                <label className="w-full flex items-center justify-center bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition-colors cursor-pointer">
                                    Seleccionar Archivo .json
                                    <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                                </label>
                            </div>
                        </div>
                        
                        <div className="mt-8 pt-8 border-t border-slate-200">
                             <div className="bg-pink-50 border border-pink-200 rounded-xl p-6 flex items-start gap-4">
                                <Icon name="bar-chart" className="text-brand-primary w-8 h-8 flex-shrink-0" />
                                <div>
                                    <h3 className="font-bold text-pink-900 mb-1">Sincronización en la Nube Activada</h3>
                                    <p className="text-sm text-pink-700">Tus datos se guardan automáticamente en Firebase. Podés entrar a este tablero desde cualquier dispositivo y los fichajes del Módulo de Asistencias aparecen al instante. Para pasar los datos del sistema anterior, exportalos desde el tablero viejo e importá ese archivo acá.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <FrasesMotivadoras showToast={showToast} />
                </div>
            );
        };

        const App = () => {
            const [usuario, setUsuario] = useState(undefined); // undefined = verificando sesión
            const [errorAcceso, setErrorAcceso] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [empleados, setEmpleados] = useState([]);
            const [historial, setHistorial] = useState([]);
            const [printData, setPrintData] = useState(null);
            const [toast, setToast] = useState(null);

            const [editData, setEditData] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null });
            const [syncStatus, setSyncStatus] = useState('connecting'); // connecting, synced, error

            useEffect(() => Datos.escucharSesion(u => setUsuario(u)), []);

            // Escucha en vivo empleados y liquidaciones mientras haya sesión iniciada
            useEffect(() => {
                if (!usuario) return;
                setSyncStatus('connecting');
                let sinPermiso = false;
                const alFallar = async (error) => {
                    console.error(error);
                    if (error.code === 'permission-denied') {
                        if (sinPermiso) return; // fallan los dos listeners: se resuelve una sola vez
                        sinPermiso = true;
                        // La cuenta de asistencias no puede ver sueldos: va directo al Módulo de Asistencias
                        if (await Datos.puedeUsarKiosco()) {
                            location.replace('asistencias.html');
                            return;
                        }
                        setErrorAcceso(`La cuenta ${usuario.email} no tiene permisos de administración.`);
                        Datos.cerrarSesion();
                    } else {
                        setSyncStatus('error');
                    }
                };
                const cancelarEmpleados = Datos.escucharEmpleados(lista => { setEmpleados(lista); setSyncStatus('synced'); }, alFallar);
                const cancelarHistorial = Datos.escucharHistorial(lista => { setHistorial(lista); setSyncStatus('synced'); }, alFallar);
                return () => {
                    cancelarEmpleados();
                    cancelarHistorial();
                };
            }, [usuario]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Ejecuta una escritura en Firebase y avisa si falla
            const guardarEnNube = async (promesa, mensajeOk) => {
                try {
                    await promesa;
                    if (mensajeOk) showToast(mensajeOk);
                    return true;
                } catch (error) {
                    console.error(error);
                    showToast('Error al guardar en la nube: ' + Datos.errorAmigable(error), 'error');
                    return false;
                }
            };

            const handleSaveLiquidacion = async (liq) => {
                const isEditing = editData && editData.idGuardado;
                const newIdGuardado = isEditing ? editData.idGuardado : Date.now();
                const recordToSave = { ...liq, idGuardado: newIdGuardado };

                const ok = await guardarEnNube(Datos.guardarLiquidacion(recordToSave), '¡Liquidación guardada y sincronizada con éxito!');
                if (!ok) return;

                setEditData(null);
                setActiveTab('informes');
            };

            const handleDeleteRecibo = (idGuardado) => {
                setConfirmDialog({
                    isOpen: true,
                    message: '¿Estás seguro de que deseas eliminar permanentemente este recibo?',
                    onConfirm: async () => {
                        setConfirmDialog({ isOpen: false });
                        await guardarEnNube(Datos.eliminarLiquidacion(idGuardado), 'Recibo eliminado correctamente.');
                    }
                });
            };

            const handleGuardarJornada = (datosJornada) =>
                guardarEnNube(Datos.guardarJornada(datosJornada), 'Jornada guardada.');

            const handleEliminarFichaje = (fichaje) => {
                setConfirmDialog({
                    isOpen: true,
                    message: `¿Eliminar la ${fichaje.tipo} de ${fichaje.empleadoNombre || 'este empleado'} del ${Datos.fechaCorta(fichaje.fecha)} a las ${fichaje.hora.slice(0, 5)}?`,
                    onConfirm: async () => {
                        setConfirmDialog({ isOpen: false });
                        await guardarEnNube(Datos.eliminarFichaje(fichaje.id), 'Fichaje eliminado.');
                    }
                });
            };

            const handleEditRecibo = (recibo) => {
                setEditData(recibo);
                if (recibo.isPremio) {
                    setActiveTab('premios');
                } else {
                    setActiveTab('liquidar');
                }
                showToast('Datos cargados. Podés modificarlos y volver a guardar.', 'success');
            };

            const handleUpdateNota = (idGuardado, nota) => {
                const record = historial.find(h => h.idGuardado === idGuardado);
                if (!record) return;
                guardarEnNube(Datos.actualizarNota(idGuardado, nota));
            };

            const EMP_VACIO = { id: null, nombre: '', legajo: '', cuil: '', puesto: '', sueldoBasico: '', presentismoFijo: '', transporteFijo: '', horasBase: 190, pinNuevo: '' };
            const [showAddEmployee, setShowAddEmployee] = useState(false);
            const [editModeEmp, setEditModeEmp] = useState(false);
            const [newEmp, setNewEmp] = useState(EMP_VACIO);

            const handleAddEmp = async (e) => {
                e.preventDefault();

                const { pinNuevo, ...datosEmp } = newEmp;
                if (pinNuevo && !Datos.esPinValido(pinNuevo)) {
                    showToast('El PIN de asistencia debe tener exactamente 6 números.', 'error');
                    return;
                }
                if (!editModeEmp && !pinNuevo) {
                    showToast('Asigná un PIN de 6 números para que pueda fichar en el Módulo de Asistencias.', 'error');
                    return;
                }

                const empDataToSave = {
                    ...datosEmp,
                    sueldoBasico: Number(newEmp.sueldoBasico) || 0,
                    presentismoFijo: Number(newEmp.presentismoFijo) || 0,
                    transporteFijo: Number(newEmp.transporteFijo) || 0,
                    horasBase: Number(newEmp.horasBase) || 190
                };
                if (!editModeEmp) {
                    empDataToSave.id = empleados.length ? Math.max(...empleados.map(e => e.id)) + 1 : 1;
                }

                const mensaje = editModeEmp
                    ? (pinNuevo ? 'Empleado actualizado en la nube (PIN cambiado)' : 'Empleado actualizado en la nube')
                    : 'Empleado agregado a la nube';
                const ok = await guardarEnNube(Datos.guardarEmpleado(empDataToSave, pinNuevo), mensaje);
                if (!ok) return;

                setShowAddEmployee(false);
                setNewEmp(EMP_VACIO);
                setEditModeEmp(false);
            };

            const openEditEmp = (emp) => {
                setNewEmp({ ...emp, horasBase: emp.horasBase || 190, pinNuevo: '' });
                setEditModeEmp(true);
                setShowAddEmployee(true);
            };

            const confirmDeleteEmp = (emp) => {
                setConfirmDialog({
                    isOpen: true,
                    message: `¿Estás seguro de que deseas eliminar permanentemente a ${emp.nombre} del sistema?`,
                    onConfirm: async () => {
                        setConfirmDialog({ isOpen: false });
                        await guardarEnNube(Datos.eliminarEmpleado(emp.id), `Empleado ${emp.nombre} eliminado de la nube.`);
                    }
                });
            };

            const navItems = [
                { id: 'dashboard', label: 'Resumen Global', icon: 'bar-chart' },
                { id: 'empleados', label: 'Directorio', icon: 'users' },
                { id: 'asistencias', label: 'Asistencias', icon: 'clock' },
                { id: 'liquidar', label: 'Liquidar Sueldos', icon: 'calculator' },
                { id: 'premios', label: 'Liquidar Premios', icon: 'award' },
                { id: 'informes', label: 'Informes y Edición', icon: 'file-text' },
                { id: 'configuracion', label: 'Config. y Respaldo', icon: 'settings' }
            ];

            // Mientras se confirma que la cuenta es de administración no se muestra el panel
            if (usuario === undefined || (usuario && syncStatus === 'connecting')) {
                return <div className="h-screen flex items-center justify-center text-slate-400 font-semibold">Cargando...</div>;
            }

            if (!usuario) {
                return <LoginScreen errorExterno={errorAcceso} />;
            }

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 font-sans">
                    <div id="print-area">
                        {printData?.type === 'recibo' && (
                            <div className="w-full max-w-4xl mx-auto mt-4">
                                <Recibo recibo={printData.data} isPremio={printData.isPremio} tipo="ORIGINAL" />
                                <div className="border-t-2 border-dashed border-slate-400 my-8 w-full"></div>
                                <Recibo recibo={printData.data} isPremio={printData.isPremio} tipo="DUPLICADO" />
                            </div>
                        )}
                        {printData?.type === 'informe' && printData.datos && printData.datos.length > 0 && (
                            <div className="w-full mt-8">
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-black uppercase tracking-wider text-slate-800">REPORTE GENERAL DE LIQUIDACIONES</h2>
                                    <p className="text-xl font-bold text-slate-600 mt-2">PERÍODO: <span className="uppercase">{printData.mes}</span></p>
                                    <p className="text-sm font-medium text-slate-500 mt-1">Fecha de Emisión: {new Date().toLocaleDateString('es-AR')}</p>
                                </div>
                                <table className="w-full text-left text-sm border-collapse border border-slate-400">
                                    <thead>
                                        <tr className="bg-slate-200 border-y-2 border-slate-400 text-black">
                                            <th className="py-2 px-2 font-bold border border-slate-400 w-40">NOMBRE</th>
                                            <th className="py-2 px-2 font-bold text-center border border-slate-400">HORAS (Dif)</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400">Básico/Men</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400">Quincenas</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400">Presentis</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400">Aguinaldo</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400">Premios</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400 text-red-700">Cta Cte</th>
                                            <th className="py-2 px-2 font-bold text-right border border-slate-400 text-red-700">Desc. Ext</th>
                                            <th className="py-2 px-2 font-black text-right border border-slate-400 bg-slate-300 text-lg">TOTAL NETO</th>
                                            <th className="py-2 px-2 font-bold text-left border border-slate-400 w-48">OBSERVACIÓN</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printData.datos.map((fila, idx) => {
                                            const dif = fila.horas - (fila.horasBase || 190);
                                            const textDif = dif > 0 ? `(+${dif})` : (dif < 0 ? `(${dif})` : `(0)`);
                                            const obsAuto = dif > 0 ? `Horas extra (+${dif}h)` : (dif < 0 ? `Ausentismo (${dif}h)` : 'Jornada completa');
                                            return (
                                                <tr key={idx} className="border-b border-slate-400">
                                                    <td className="py-2 px-2 font-bold text-black border border-slate-400">{fila.nombre}</td>
                                                    <td className="py-2 px-2 text-center font-semibold text-slate-800 border border-slate-400">{fila.horas} <span className="text-[10px]">{textDif}</span></td>
                                                    <td className="py-2 px-2 text-right border border-slate-400">{formatCurrency(fila.mensual)}</td>
                                                    <td className="py-2 px-2 text-right border border-slate-400">{formatCurrency(fila.q1 + fila.q2)}</td>
                                                    <td className="py-2 px-2 text-right border border-slate-400">{formatCurrency(fila.presentismo)}</td>
                                                    <td className="py-2 px-2 text-right border border-slate-400">{formatCurrency(fila.aguinaldo)}</td>
                                                    <td className="py-2 px-2 text-right border border-slate-400">{formatCurrency(fila.premios)}</td>
                                                    <td className="py-2 px-2 text-right text-red-700 font-medium border border-slate-400">{formatCurrency(fila.ctaCte)}</td>
                                                    <td className="py-2 px-2 text-right text-red-700 font-medium border border-slate-400">{formatCurrency(fila.otrosDesc)}</td>
                                                    <td className="py-2 px-2 text-right font-black text-black bg-slate-100 border border-slate-400 text-base">{formatCurrency(fila.total)}</td>
                                                    <td className="py-2 px-2 text-left text-[11px] text-slate-700 border border-slate-400">{fila.observacion || obsAuto}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                    <tfoot>
                                        <tr className="bg-slate-300 text-black font-bold">
                                            <td className="py-3 px-2 border border-slate-400">TOTALES DEL MES</td>
                                            <td className="py-3 px-2 text-center border border-slate-400">{printData.datos.reduce((a, b) => a + b.horas, 0)} hs</td>
                                            <td className="py-3 px-2 text-right border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.mensual, 0))}</td>
                                            <td className="py-3 px-2 text-right border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.q1 + b.q2, 0))}</td>
                                            <td className="py-3 px-2 text-right border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.presentismo, 0))}</td>
                                            <td className="py-3 px-2 text-right border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.aguinaldo, 0))}</td>
                                            <td className="py-3 px-2 text-right border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.premios, 0))}</td>
                                            <td className="py-3 px-2 text-right text-red-800 border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.ctaCte, 0))}</td>
                                            <td className="py-3 px-2 text-right text-red-800 border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.otrosDesc, 0))}</td>
                                            <td className="py-3 px-2 text-right text-xl font-black border border-slate-400">{formatCurrency(printData.datos.reduce((a, b) => a + b.total, 0))}</td>
                                            <td className="py-3 px-2 border border-slate-400"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        )}
                    </div>

                    <ConfirmModal isOpen={confirmDialog.isOpen} message={confirmDialog.message} onCancel={() => setConfirmDialog({ isOpen: false })} onConfirm={confirmDialog.onConfirm} />

                    {/* Left Navigation Sidebar with updated branding */}
                    <div className="w-72 bg-white text-brand-negro flex flex-col border-r border-slate-200 shadow-sm z-20">
                        <div className="p-6 border-b border-slate-200 border-t-4 border-t-brand-primary">
                            {/* Brand Header */}
                            <img src="img/logo-modashop.png" alt="MODASHOP" className="h-10 w-auto object-contain mb-3" />
                            <p className="text-xs font-black tracking-[0.25em] text-slate-500">SISTEMA DE <span className="text-brand-primary">SUELDOS</span></p>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto mt-2">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setEditData(null); }}
                                    className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-200 ${activeTab === item.id ? 'bg-brand-primary text-white shadow-md shadow-brand-primary/30 translate-x-1' : 'text-slate-600 hover:bg-pink-50 hover:text-brand-primary'}`}>
                                    <Icon name={item.icon}/> <span className="font-semibold text-sm tracking-wide">{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        {/* Acceso directo al Módulo de Asistencias */}
                        <div className="px-4 pb-4">
                            <a href="asistencias.html" className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl border-2 border-brand-primary text-brand-primary font-bold text-sm hover:bg-pink-50 transition-colors">
                                <Icon name="clock" className="w-4 h-4"/> Módulo de Asistencias
                            </a>
                        </div>

                        {/* Sync Status Indicator */}
                        <div className="p-4 border-t border-slate-200">
                            <div className="flex items-center justify-center gap-2 text-xs font-medium">
                                {syncStatus === 'connecting' && <><span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> <span className="text-slate-500">Conectando...</span></>}
                                {syncStatus === 'synced' && <><span className="w-2 h-2 rounded-full bg-emerald-500"></span> <span className="text-slate-500">En línea (Sincronizado)</span></>}
                                {syncStatus === 'error' && <><span className="w-2 h-2 rounded-full bg-brand-primary"></span> <span className="text-slate-500">Sin conexión con la nube</span></>}
                            </div>
                            <p className="mt-2 text-center text-[10px] text-slate-400 truncate">{usuario.email}</p>
                            <button onClick={() => { setErrorAcceso(''); Datos.cerrarSesion(); }} className="mt-2 w-full text-center text-xs font-semibold text-slate-500 hover:text-brand-primary transition-colors">
                                Cerrar Sesión
                            </button>
                            <div className="mt-3 text-center"><MarcaPSM /></div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-y-auto relative">
                        {toast && (
                            <div className={`fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl toast-enter flex items-center gap-3 font-medium text-white ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                {toast.message}
                            </div>
                        )}

                        <main className="h-full">
                            {activeTab === 'dashboard' && <div className="p-8"><Dashboard historial={historial} /></div>}

                            {activeTab === 'empleados' && (
                                <div className="p-8 space-y-6 max-w-6xl mx-auto">
                                    <div className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-800">Directorio del Personal</h2>
                                            <p className="text-slate-500 text-sm mt-1">Gestioná, agregá o eliminá empleados de la nómina.</p>
                                        </div>
                                        <button onClick={() => { setEditModeEmp(false); setNewEmp(EMP_VACIO); setShowAddEmployee(true); }} className="bg-brand-primary text-white px-5 py-2.5 rounded-lg font-bold hover:bg-opacity-90 transition-colors shadow">
                                            + Nuevo Empleado
                                        </button>
                                    </div>

                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50 border-b border-slate-200 uppercase text-xs text-slate-500">
                                                <tr>
                                                    <th className="py-4 px-6 font-semibold">Nombre y Legajo</th>
                                                    <th className="py-4 px-6 font-semibold">Puesto</th>
                                                    <th className="py-4 px-6 font-semibold text-right text-brand-primary">Sueldo Básico</th>
                                                    <th className="py-4 px-6 font-semibold text-right text-green-700">Presentismo Fijo</th>
                                                    <th className="py-4 px-6 font-semibold text-right text-blue-700">SUBE / Transp.</th>
                                                    <th className="py-4 px-6 font-semibold text-center">PIN Asist.</th>
                                                    <th className="py-4 px-6 font-semibold text-center">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {empleados.map(emp => (
                                                    <tr key={emp.id} className="hover:bg-slate-50 group">
                                                        <td className="py-4 px-6 font-bold text-slate-800">{emp.nombre} <span className="text-slate-400 font-normal ml-2">#{emp.legajo}</span></td>
                                                        <td className="py-4 px-6 text-slate-600">{emp.puesto}</td>
                                                        <td className="py-4 px-6 text-right font-black text-brand-primary">{formatCurrency(emp.sueldoBasico)}</td>
                                                        <td className="py-4 px-6 text-right font-bold text-green-700">{formatCurrency(emp.presentismoFijo)}</td>
                                                        <td className="py-4 px-6 text-right font-bold text-blue-700">{formatCurrency(emp.transporteFijo)}</td>
                                                        <td className="py-4 px-6 text-center">
                                                            {emp.tienePin
                                                                ? <span className="bg-emerald-100 text-emerald-700 text-[10px] font-black px-2 py-0.5 rounded-full">ASIGNADO</span>
                                                                : <span className="bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded-full">SIN PIN</span>}
                                                        </td>
                                                        <td className="py-4 px-6 text-center">
                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => openEditEmp(emp)} className="p-2 text-brand-primary hover:bg-pink-100 rounded-lg transition-colors" title="Editar">
                                                                    <Icon name="edit" className="w-4 h-4"/>
                                                                </button>
                                                                <button onClick={() => confirmDeleteEmp(emp)} className="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Eliminar">
                                                                    <Icon name="trash" className="w-4 h-4"/>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {empleados.length === 0 && (
                                                    <tr><td colSpan="7" className="py-8 text-center text-slate-400 font-medium">No hay empleados registrados.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>

                                    {showAddEmployee && (
                                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                                <div className="flex justify-between items-center mb-6">
                                                    <h3 className="text-xl font-bold">{editModeEmp ? 'Editar Empleado' : 'Agregar Empleado'}</h3>
                                                    <button onClick={() => setShowAddEmployee(false)} className="text-slate-400 hover:text-black"><Icon name="x"/></button>
                                                </div>
                                                <form onSubmit={handleAddEmp} className="space-y-4">
                                                    <input required type="text" placeholder="Nombre Completo" value={newEmp.nombre} onChange={e => setNewEmp({...newEmp, nombre: e.target.value})} className="w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-brand-primary outline-none" />
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <input type="text" placeholder="Legajo (Opc)" value={newEmp.legajo} onChange={e => setNewEmp({...newEmp, legajo: e.target.value})} className="w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-brand-primary outline-none" />
                                                        <input type="text" placeholder="CUIL" value={newEmp.cuil} onChange={e => setNewEmp({...newEmp, cuil: e.target.value})} className="w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-brand-primary outline-none" />
                                                    </div>
                                                    <input type="text" placeholder="Puesto / Categoría (Vendedor/a, Armador/a)" value={newEmp.puesto} onChange={e => setNewEmp({...newEmp, puesto: e.target.value})} className="w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-brand-primary outline-none" />
                                                    
                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-2">
                                                        <div className="bg-pink-50 p-2 border border-pink-200 rounded-lg">
                                                            <label className="text-[9px] font-bold text-brand-primary uppercase mb-1 block">Sueldo Básico ($)</label>
                                                            <input type="number" required placeholder="Ej: 650000" value={newEmp.sueldoBasico} onChange={e => setNewEmp({...newEmp, sueldoBasico: e.target.value})} className="w-full border p-1.5 rounded border-pink-300 bg-white focus:ring-2 focus:ring-brand-primary outline-none text-sm" />
                                                        </div>
                                                        <div className="bg-green-50 p-2 border border-green-200 rounded-lg">
                                                            <label className="text-[9px] font-bold text-green-700 uppercase mb-1 block">Presentismo ($)</label>
                                                            <input type="number" placeholder="Ej: 150000" value={newEmp.presentismoFijo} onChange={e => setNewEmp({...newEmp, presentismoFijo: e.target.value})} className="w-full border p-1.5 rounded border-green-300 bg-white focus:ring-2 focus:ring-green-500 outline-none text-sm" />
                                                        </div>
                                                        <div className="bg-blue-50 p-2 border border-blue-200 rounded-lg">
                                                            <label className="text-[9px] font-bold text-blue-700 uppercase mb-1 block">SUBE ($)</label>
                                                            <input type="number" placeholder="Ej: 30000" value={newEmp.transporteFijo} onChange={e => setNewEmp({...newEmp, transporteFijo: e.target.value})} className="w-full border p-1.5 rounded border-blue-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                                        </div>
                                                        <div className="bg-amber-50 p-2 border border-amber-200 rounded-lg">
                                                            <label className="text-[9px] font-bold text-amber-700 uppercase mb-1 block">Horas Mensuales</label>
                                                            <input type="number" placeholder="Ej: 190" value={newEmp.horasBase} onChange={e => setNewEmp({...newEmp, horasBase: e.target.value})} className="w-full border p-1.5 rounded border-amber-300 bg-white focus:ring-2 focus:ring-amber-500 outline-none text-sm" />
                                                        </div>
                                                    </div>
                                                    <div className="bg-slate-50 p-3 border border-slate-200 rounded-lg">
                                                        <label className="text-[10px] font-bold text-slate-600 uppercase mb-1 flex items-center gap-1">
                                                            <Icon name="lock" className="w-3 h-3"/> PIN Módulo de Asistencias (6 números)
                                                        </label>
                                                        <input
                                                            type="password"
                                                            inputMode="numeric"
                                                            autoComplete="new-password"
                                                            maxLength={6}
                                                            placeholder={editModeEmp ? (newEmp.tienePin ? 'Dejar vacío para mantener el actual' : 'Sin PIN asignado') : 'Ej: 482915'}
                                                            value={newEmp.pinNuevo}
                                                            onChange={e => setNewEmp({ ...newEmp, pinNuevo: e.target.value.replace(/\D/g, '').slice(0, 6) })}
                                                            className="w-full border p-2 rounded border-slate-300 bg-white focus:ring-2 focus:ring-brand-primary outline-none text-sm tracking-[0.4em] font-bold"
                                                        />
                                                        <p className="text-[10px] text-slate-400 mt-1">Por seguridad el PIN no se puede ver después de guardarlo, solo reemplazar.</p>
                                                    </div>
                                                    <button type="submit" className="w-full bg-brand-primary text-white font-bold py-3 rounded-lg hover:bg-opacity-90 mt-4 shadow">{editModeEmp ? 'Guardar Cambios' : 'Guardar Empleado'}</button>
                                                </form>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'asistencias' && (
                                <SeccionAsistencias empleados={empleados} onGuardarJornada={handleGuardarJornada} onEliminarFichaje={handleEliminarFichaje} showToast={showToast} />
                            )}

                            {activeTab === 'liquidar' && (
                                <Liquidador empleados={empleados}editData={editData} onSave={handleSaveLiquidacion} showToast={showToast} setPrintData={setPrintData} />
                            )}

                            {activeTab === 'premios' && (
                                <LiquidadorPremios empleados={empleados} editData={editData} onSave={handleSaveLiquidacion} setPrintData={setPrintData} />
                            )}

                            {activeTab === 'informes' && (
                                <div className="p-8">
                                    <SeccionInformes 
                                        historial={historial} 
                                        empleados={empleados} 
                                        setPrintData={setPrintData} 
                                        handleDelete={handleDeleteRecibo} 
                                        handleEdit={handleEditRecibo} 
                                        handleUpdateNota={handleUpdateNota}
                                    />
                                </div>
                            )}

                            {activeTab === 'configuracion' && (
                                <Configuracion empleados={empleados} historial={historial} showToast={showToast} />
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        // js/datos.js es un módulo: puede terminar de cargar antes o después que este script
        const iniciar = () => ReactDOM.render(Datos.configurado ? <App /> : <FaltaConfiguracion />, document.getElementById('root'));
        if (window.Datos) iniciar();
        else window.addEventListener('datos-listo', iniciar, { once: true });
    </script>
</body>
</html>
